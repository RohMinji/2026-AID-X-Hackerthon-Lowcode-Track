<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f5ff">
<title>AID-X Day</title>
<meta name="description" content="AID-X Day 행사 안내 — 프로그램, 층별 안내, 셔틀, 참여 방법">
<style>
  :root {
    --bg-0: #f4f5ff;
    --panel: rgba(255, 255, 255, 0.74);
    --panel-2: rgba(244, 245, 255, 0.9);
    --ink: #15173d;
    --ink-dim: #565c8a;
    --ink-faint: #8a8fb3;
    --accent: #3d4bff;
    --accent-2: #8b5cff;
    --grad: linear-gradient(100deg, #2f6bff 0%, #5b4bff 48%, #a066ff 100%);
    --border: rgba(88, 80, 255, 0.13);
    --shadow: 0 10px 30px rgba(60, 50, 180, 0.08), 0 1px 2px rgba(60, 50, 180, 0.06);
    --warn-bg: #fff4d1;
    --warn-ink: #7a5600;
    --live: #14b87a;
    --radius: 20px;
    --gutter: 16px;
    --tabbar-h: 64px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: var(--bg-0);
    color: var(--ink);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", system-ui, sans-serif;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    word-break: keep-all;
    overflow-x: hidden;
  }
  a { color: inherit; }
  button { font: inherit; color: inherit; }

  /* 배경: 라벤더 화이트 + 파랑·보라 빛 번짐 + 점 격자 */
  .bg {
    position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(55% 45% at 8% 0%, rgba(120, 100, 255, 0.22), transparent 70%),
      radial-gradient(45% 40% at 100% 10%, rgba(60, 130, 255, 0.18), transparent 70%),
      radial-gradient(60% 45% at 60% 100%, rgba(170, 110, 255, 0.14), transparent 70%),
      var(--bg-0);
  }
  .bg::after {
    content: ""; position: absolute; inset: 0;
    background-image: radial-gradient(rgba(70, 60, 200, 0.12) 1px, transparent 1.2px);
    background-size: 22px 22px;
    -webkit-mask-image: radial-gradient(80% 60% at 50% 15%, #000 20%, transparent 75%);
            mask-image: radial-gradient(80% 60% at 50% 15%, #000 20%, transparent 75%);
  }
  .grad-text {
    background: var(--grad);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }

  /* ---------- 상단 바 ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 30;
    background: rgba(255, 255, 255, 0.72);
    backdrop-filter: blur(16px) saturate(1.4); -webkit-backdrop-filter: blur(16px) saturate(1.4);
    border-bottom: 1px solid var(--border);
    padding-top: env(safe-area-inset-top);
  }
  .topbar-inner {
    max-width: 1200px; margin: 0 auto; padding: 0 var(--gutter);
    height: 56px; display: flex; align-items: center; gap: 12px;
  }
  .brand { font-weight: 900; font-size: 18px; text-decoration: none; white-space: nowrap; letter-spacing: -0.01em; }
  .brand b { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .status-pill {
    margin-left: auto; font-size: 13px; color: var(--ink-dim);
    font-variant-numeric: tabular-nums; white-space: nowrap;
    padding: 5px 12px; border-radius: 999px; background: rgba(255,255,255,.8); border: 1px solid var(--border);
  }
  .status-pill strong { color: var(--accent); font-weight: 800; }

  .sample-banner {
    background: var(--warn-bg); color: var(--warn-ink);
    font-size: 12px; text-align: center; padding: 6px var(--gutter);
    border-bottom: 1px solid rgba(200, 150, 0, 0.18);
  }
  .preview-banner {
    background: #ece8ff; color: #4b33c9;
    font-size: 12px; text-align: center; padding: 6px var(--gutter);
  }

  /* ---------- 레이아웃 ---------- */
  .layout { max-width: 1200px; margin: 0 auto; padding: 0 var(--gutter); }
  main { padding: 20px 0 calc(var(--tabbar-h) + 32px + env(safe-area-inset-bottom)); min-width: 0; }

  /* 탭 바: 모바일은 화면 아래 고정 */
  .tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
    display: grid; grid-template-columns: repeat(5, 1fr);
    height: calc(var(--tabbar-h) + env(safe-area-inset-bottom));
    padding-bottom: env(safe-area-inset-bottom);
    background: rgba(255, 255, 255, 0.86);
    backdrop-filter: blur(16px) saturate(1.4); -webkit-backdrop-filter: blur(16px) saturate(1.4);
    border-top: 1px solid var(--border);
    box-shadow: 0 -6px 24px rgba(60, 50, 180, 0.06);
  }
  .tab {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    text-decoration: none; color: var(--ink-faint); font-size: 11px; font-weight: 600;
  }
  .tab svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .tab[aria-current="page"] { color: var(--accent); }

  .view { display: none; }
  .view.active { display: block; animation: fade .25s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* 떠 있는 유리 오브젝트 */
  @keyframes floaty { 0%, 100% { transform: translateY(0) rotate(var(--r, 0deg)); } 50% { transform: translateY(-10px) rotate(var(--r, 0deg)); } }
  .float { animation: floaty 6s ease-in-out infinite; will-change: transform; }
  @media (prefers-reduced-motion: reduce) { .float, .view.active { animation: none; } }

  .page-head { position: relative; display: flex; align-items: center; min-height: 64px; margin: 0 0 16px; }
  h2.page-title { margin: 0; font-size: 26px; font-weight: 900; letter-spacing: -0.02em; }
  .page-head img { position: absolute; right: 4px; top: 50%; width: 78px; height: auto; margin-top: -50px; pointer-events: none; }

  .section-label {
    display: flex; align-items: center; gap: 8px;
    margin: 0 0 12px; font-size: 13px; font-weight: 800; letter-spacing: 0.08em; color: var(--accent);
  }
  .section-label::before {
    content: ""; width: 8px; height: 8px; border-radius: 3px;
    background: var(--grad); transform: rotate(45deg);
  }

  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 18px;
    box-shadow: var(--shadow);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  }
  .stack { display: grid; gap: 16px; }
  .muted { color: var(--ink-dim); }
  .faint { color: var(--ink-faint); }
  .small { font-size: 13px; }

  /* 세그먼트(일차/보기 전환) */
  .seg {
    display: inline-flex; padding: 4px; gap: 4px;
    background: rgba(255,255,255,.8); border: 1px solid var(--border); border-radius: 14px;
    box-shadow: var(--shadow);
  }
  .seg button {
    border: 0; background: transparent; padding: 8px 14px; border-radius: 10px;
    font-size: 14px; font-weight: 700; color: var(--ink-dim); cursor: pointer; white-space: nowrap;
  }
  .seg button[aria-pressed="true"] { background: var(--grad); color: #fff; box-shadow: 0 4px 14px rgba(80, 70, 255, .3); }
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }

  .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 14px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; border: 1px solid var(--border); background: rgba(255,255,255,.75);
    padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--ink-dim); cursor: pointer;
  }
  .chip[aria-pressed="true"] { border-color: var(--c, var(--accent)); color: var(--c, var(--accent)); background: color-mix(in srgb, var(--c, var(--accent)) 10%, #fff); }

  .badge {
    display: inline-block; font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 999px;
    color: var(--c); background: color-mix(in srgb, var(--c) 11%, #fff);
    border: 1px solid color-mix(in srgb, var(--c) 30%, transparent);
    white-space: nowrap;
  }
  .live-dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: var(--live); box-shadow: 0 0 0 0 rgba(20, 184, 122, .5);
    animation: pulse 1.6s infinite; margin-right: 6px; vertical-align: 1px;
  }
  @keyframes pulse { 70% { box-shadow: 0 0 0 8px rgba(20, 184, 122, 0); } 100% { box-shadow: 0 0 0 0 rgba(20, 184, 122, 0); } }

  .linkish {
    background: none; border: 0; padding: 0; cursor: pointer;
    color: var(--accent); text-decoration: underline; text-underline-offset: 3px; font-size: inherit; font-weight: 600;
  }

  /* ---------- 홈 ---------- */
  .hero { position: relative; display: grid; gap: 4px; padding: 0 0 20px; }
  .hero-art { position: relative; height: 230px; margin: 0 auto; width: 100%; max-width: 360px; }
  .hero-art img { position: absolute; height: auto; pointer-events: none; user-select: none; }
  .hero-art .a-ai   { width: 54%; left: 26%; top: 4%; --r: -4deg; }
  .hero-art .a-ring { width: 38%; left: 0; top: 32%; --r: 8deg; animation-delay: -2s; }
  .hero-art .a-star { width: 20%; right: 4%; top: 0; --r: 10deg; animation-delay: -4s; }
  .hero-text { text-align: center; }
  .eyebrow {
    display: inline-block; font-size: 12px; font-weight: 800; letter-spacing: 0.14em; color: var(--accent);
    background: rgba(255,255,255,.8); border: 1px solid var(--border); border-radius: 999px; padding: 5px 12px; margin-bottom: 12px;
  }
  .hero h1 {
    margin: 0 0 10px; font-size: clamp(44px, 12vw, 88px); line-height: 1.0; font-weight: 900; letter-spacing: -0.035em;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .hero .tagline { margin: 0 0 14px; color: var(--ink-dim); font-size: clamp(15px, 2vw, 18px); }
  .meta-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .meta {
    font-size: 13px; font-weight: 600; padding: 7px 13px; border-radius: 999px;
    background: rgba(255,255,255,.85); border: 1px solid var(--border); box-shadow: var(--shadow);
  }

  .countdown-label { font-size: 12px; font-weight: 700; letter-spacing: 0.1em; color: var(--ink-dim); text-align: center; margin-bottom: 10px; }
  .cd-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .cd-cell { background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 12px 0 8px; text-align: center; box-shadow: 0 4px 14px rgba(60,50,180,.06); }
  .cd-num {
    font-size: clamp(28px, 8vw, 48px); font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1.05;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .cd-unit { font-size: 12px; color: var(--ink-dim); }
  .ended { text-align: center; font-size: 20px; font-weight: 800; color: var(--accent); padding: 8px 0; }

  .now-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .now-item { display: grid; gap: 4px; padding: 12px; border-radius: 14px; background: #fff; border: 1px solid var(--border); }
  .now-item .t { font-weight: 700; }
  .now-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 10px; }
  .now-head h3 { margin: 0; font-size: 16px; }

  .quick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .quick a {
    display: flex; align-items: center; gap: 10px; padding: 14px; border-radius: 16px;
    background: var(--panel); border: 1px solid var(--border); text-decoration: none; font-weight: 800; font-size: 15px;
    box-shadow: var(--shadow); transition: transform .15s, border-color .15s;
  }
  .quick a:hover { transform: translateY(-2px); border-color: rgba(88, 80, 255, .35); }
  .quick a svg { width: 22px; height: 22px; stroke: var(--accent); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .quick a span small { display: block; font-weight: 500; font-size: 12px; color: var(--ink-dim); }

  .notice-list { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
  .notice-list li { display: grid; grid-template-columns: auto 1fr; gap: 10px; font-size: 14px; }
  .notice-list time { color: var(--ink-faint); font-size: 12px; font-variant-numeric: tabular-nums; padding-top: 2px; }

  /* ---------- 프로그램 ---------- */
  .timeline { list-style: none; margin: 0; padding: 0; }
  .sess {
    display: grid; grid-template-columns: 58px 1fr; gap: 12px;
    padding: 14px 0; border-top: 1px solid var(--border);
  }
  .sess:first-child { border-top: 0; padding-top: 0; }
  .sess .when { font-variant-numeric: tabular-nums; font-weight: 800; color: var(--accent); font-size: 15px; line-height: 1.2; }
  .sess .when small { display: block; color: var(--ink-faint); font-weight: 500; font-size: 12px; margin-top: 2px; }
  .sess .title { font-weight: 800; font-size: 15px; margin: 4px 0 2px; }
  .sess .who { font-size: 13px; color: var(--ink-dim); }
  .sess .desc { font-size: 13px; color: var(--ink-dim); margin-top: 4px; }
  .sess .where { font-size: 13px; margin-top: 4px; }
  .sess.is-past { opacity: .45; }
  .sess.is-now {
    margin: 0 -18px; padding-left: 18px; padding-right: 18px;
    background: linear-gradient(90deg, rgba(61, 75, 255, .08), rgba(139, 92, 255, .04)); box-shadow: inset 3px 0 0 var(--accent);
  }
  .empty { text-align: center; color: var(--ink-dim); padding: 24px 0; }

  /* 전시 목록 */
  .ex-part { margin-bottom: 26px; }
  .ex-part-head { display: flex; align-items: center; gap: 10px; margin: 0 0 12px; }
  .ex-part-head img { width: 38px; height: 38px; object-fit: contain; }
  .ex-part-head h3 { margin: 0; font-size: 22px; font-weight: 900; color: var(--c); letter-spacing: -0.01em; }
  .ex-grid { display: grid; gap: 10px; }
  .ex-card {
    position: relative; overflow: hidden;
    display: block; text-decoration: none; padding: 16px; border-radius: 18px;
    background: var(--panel); border: 1px solid var(--border); box-shadow: var(--shadow);
    transition: border-color .15s, transform .15s, box-shadow .15s;
  }
  .ex-card::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
    background: linear-gradient(180deg, var(--c), color-mix(in srgb, var(--c) 30%, transparent));
  }
  .ex-card:hover { border-color: color-mix(in srgb, var(--c) 45%, transparent); transform: translateY(-2px); box-shadow: 0 14px 34px rgba(60, 50, 180, .12); }
  .ex-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .ex-no { font-size: 12px; font-weight: 800; color: var(--c); font-variant-numeric: tabular-nums; letter-spacing: .04em; }
  .ex-title { font-size: 16px; font-weight: 800; line-height: 1.38; }
  .ex-title span { display: block; }
  .ex-title span + span { margin-top: 4px; }
  .ex-team { font-size: 13px; color: var(--ink-dim); margin-top: 6px; }
  .ex-sum { font-size: 14px; color: var(--ink-dim); margin-top: 8px; }
  .ex-more { font-size: 13px; font-weight: 800; color: var(--c); margin-top: 10px; }

  /* ---------- 층별 안내 ---------- */
  .floor-tabs { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; margin-bottom: 14px; }
  .floor-tabs button {
    border: 1px solid var(--border); background: rgba(255,255,255,.8); border-radius: 14px;
    padding: 10px 0; font-weight: 900; font-size: 16px; color: var(--ink-dim); cursor: pointer; box-shadow: var(--shadow);
  }
  .floor-tabs button[aria-pressed="true"] { border-color: transparent; color: #fff; background: var(--grad); box-shadow: 0 6px 18px rgba(80, 70, 255, .3); }
  .floor-map { width: 100%; border-radius: 14px; border: 1px solid var(--border); margin-bottom: 14px; display: block; }
  .rooms { display: grid; gap: 10px; }
  .room { padding: 14px; border-radius: 16px; background: #fff; border: 1px solid var(--border); }
  .room.hl-room { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(61, 75, 255, .25), 0 10px 30px rgba(61, 75, 255, .15); }
  .room h3 { margin: 0 0 2px; font-size: 16px; }
  .room .d { font-size: 13px; color: var(--ink-dim); }
  .room .live { font-size: 13px; margin-top: 8px; }
  .facilities { margin: 0; padding-left: 18px; font-size: 14px; }
  .facilities li { margin: 4px 0; }

  /* ---------- 셔틀 ---------- */
  .route h3 { margin: 0 0 4px; font-size: 17px; }
  .route .stop { font-size: 13px; color: var(--ink-dim); margin-bottom: 12px; }
  .next-bus {
    display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
    padding: 12px 14px; border-radius: 14px; margin-bottom: 12px;
    background: linear-gradient(100deg, rgba(47, 107, 255, .09), rgba(160, 102, 255, .09)); border: 1px solid rgba(61, 75, 255, .22);
  }
  .next-bus b { font-size: 22px; font-weight: 900; color: var(--accent); font-variant-numeric: tabular-nums; }
  .times { display: flex; flex-wrap: wrap; gap: 6px; }
  .times span {
    font-variant-numeric: tabular-nums; font-size: 14px; padding: 5px 10px; border-radius: 10px;
    background: #fff; border: 1px solid var(--border);
  }
  .times span.past { opacity: .35; text-decoration: line-through; }
  .times span.next { border-color: transparent; color: #fff; background: var(--grad); font-weight: 800; }
  .btn {
    display: inline-block; margin-top: 12px; padding: 10px 18px; border-radius: 12px;
    font-weight: 800; font-size: 14px; text-decoration: none; color: #fff;
    background: var(--grad); box-shadow: 0 6px 18px rgba(80, 70, 255, .28);
  }

  /* ---------- 참여 방법 ---------- */
  .steps { list-style: none; margin: 0; padding: 0; counter-reset: step; display: grid; gap: 12px; }
  .steps li { counter-increment: step; display: grid; grid-template-columns: 36px 1fr; gap: 12px; align-items: start; }
  .steps li::before {
    content: counter(step); width: 36px; height: 36px; border-radius: 12px;
    display: grid; place-items: center; font-weight: 900; color: #fff;
    background: var(--grad); box-shadow: 0 4px 12px rgba(80, 70, 255, .3);
  }
  .steps h3 { margin: 6px 0 2px; font-size: 16px; }
  .steps p { margin: 0; font-size: 14px; color: var(--ink-dim); }
  details { border-top: 1px solid var(--border); padding: 12px 0; }
  details:first-of-type { border-top: 0; padding-top: 0; }
  summary { cursor: pointer; font-weight: 700; list-style: none; display: flex; justify-content: space-between; gap: 8px; }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: "+"; color: var(--accent); font-weight: 900; }
  details[open] summary::after { content: "−"; }
  details p { margin: 8px 0 0; font-size: 14px; color: var(--ink-dim); }
  .contact { display: grid; gap: 6px; font-size: 14px; }

  footer { text-align: center; font-size: 12px; color: var(--ink-faint); padding: 24px 0 0; }

  /* =====================================================================
     태블릿
     ===================================================================== */
  @media (min-width: 720px) {
    :root { --gutter: 28px; }
    .ex-grid { grid-template-columns: 1fr 1fr; }
    .quick { grid-template-columns: repeat(4, 1fr); }
    .home-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .home-grid > :only-child { grid-column: 1 / -1; }
    .rooms { grid-template-columns: 1fr 1fr; }
    .shuttle-grid { grid-template-columns: 1fr 1fr; }
    .page-head img { width: 100px; margin-top: -60px; }
  }

  /* =====================================================================
     PC: 왼쪽 메뉴 + 오른쪽 내용
     ===================================================================== */
  @media (min-width: 1000px) {
    .layout { display: grid; grid-template-columns: 200px 1fr; gap: 40px; }
    main { padding: 36px 0 56px; }
    .tabs {
      position: sticky; top: 76px; align-self: start;
      display: flex; flex-direction: column; gap: 4px;
      height: auto; padding: 36px 0 0; margin: 0;
      background: none; border: 0; box-shadow: none; backdrop-filter: none; -webkit-backdrop-filter: none;
    }
    .tab {
      flex-direction: row; justify-content: flex-start; gap: 12px;
      padding: 12px 14px; border-radius: 14px; font-size: 15px; color: var(--ink-dim);
    }
    .tab:hover { background: rgba(255,255,255,.7); color: var(--ink); }
    .tab[aria-current="page"] { background: #fff; color: var(--accent); box-shadow: var(--shadow); }
    h2.page-title { font-size: 34px; }
    .page-head { min-height: 96px; margin-bottom: 20px; }
    .page-head img { width: 128px; margin-top: -70px; right: 12px; }
    .card { padding: 24px; }
    .hero { grid-template-columns: 1.1fr 1fr; align-items: center; gap: 24px; padding: 0 0 28px; }
    .hero-text { text-align: left; order: -1; }
    .hero-art { height: 360px; max-width: 460px; }
    .meta-row { justify-content: flex-start; }
    .sess { grid-template-columns: 72px 1fr; }
    .sess.is-now { margin: 0 -24px; padding-left: 24px; padding-right: 24px; }
    .sess .title { font-size: 17px; }
    .ex-grid { grid-template-columns: repeat(3, 1fr); }
    .rooms { grid-template-columns: repeat(3, 1fr); }
    .floor-tabs { max-width: 420px; }
  }
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>

<header class="topbar">
  <div class="topbar-inner">

// ---------- 유틸 ----------
const $ = id => document.getElementById(id);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "style") el.style.cssText = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    el.appendChild(typeof kid === "string" || typeof kid === "number" ? document.createTextNode(kid) : kid);
  }
  return el;
}
const pad = n => String(n).padStart(2, "0");
const at = (date, hm) => new Date(`${date}T${hm}:00+09:00`).getTime();
const dayOf = id => EVENT.days.find(d => d.id === id);
const track = k => EVENT.tracks[k] || { name: k, color: "#9fb0d9" };
const room = k => EVENT.rooms[k] || { name: k, floor: "" };
const badge = k => h("span", { class: "badge", style: `--c:${track(k).color}` }, track(k).name);

// 컨셉 이미지 (img 폴더)
const ART = { ai: "img/ai.webp", ring: "img/ring.webp", star: "img/star.webp", cursor: "img/cursor.webp", layers: "img/layers.webp" };
const pageHead = (title, art) => h("div", { class: "page-head" },
  h("h2", { class: "page-title" }, title),
  art ? h("img", { class: "float", src: art, alt: "", "aria-hidden": "true" }) : null);

// 미리보기: 주소 뒤에 ?now=2026-10-14T13:05 를 붙이면 그 시각 기준으로 보여줘요
let offset = 0;
const nowParam = new URLSearchParams(location.search).get("now");
if (nowParam) {
  const t = new Date(/[zZ]|[+-]\d\d:?\d\d$/.test(nowParam) ? nowParam : nowParam + "+09:00").getTime();
  if (!isNaN(t)) {
    offset = t - Date.now();
    $("preview-banner").hidden = false;
    $("preview-banner").textContent = `미리보기 모드: ${nowParam.replace("T", " ")} (KST) 기준으로 보여주고 있어요.`;
  }
}
const now = () => Date.now() + offset;
const kstDate = t => new Date(t + 9 * 3600e3).toISOString().slice(0, 10);

// 세션에 절대 시각을 붙여 둠
EVENT.sessions.forEach(s => {
  const d = dayOf(s.day);
  s.t0 = at(d.date, s.start);
  s.t1 = at(d.date, s.end);
});
EVENT.days.forEach(d => { d.t0 = at(d.date, d.open); d.t1 = at(d.date, d.close); });

function todayDay() { const k = kstDate(now()); return EVENT.days.find(d => d.date === k); }

// 현재 상태: before(첫날 전) / live(운영 중) / between(일차 사이) / after(종료)
function phase() {
  const t = now();
  for (let i = 0; i < EVENT.days.length; i++) {
    const d = EVENT.days[i];
    if (t < d.t0) return { kind: i === 0 ? "before" : "between", target: d };
    if (t < d.t1) return { kind: "live", day: d };
  }
  return { kind: "after" };
}

// ---------- 상태 ----------
const state = {
  tab: "home",
  day: (todayDay() || EVENT.days[0]).id,
  view: "talk",
  part: "all",
  track: "all",
  floor: EVENT.floors.find(f => f.id === "1F") ? "1F" : EVENT.floors[0].id,
  highlightRoom: null,
};

function goRoom(roomKey) {
  state.floor = room(roomKey).floor;
  state.highlightRoom = roomKey;
  location.hash = "#floors";
  renderFloors();
  window.scrollTo(0, 0);
}
const roomLink = k => h("button", { class: "linkish", onclick: () => goRoom(k) }, `${room(k).floor} ${room(k).name}`);

function seg(options, current, onPick) {
  return h("div", { class: "seg", role: "group" },
    options.map(o => h("button", { "aria-pressed": String(o.value === current), onclick: () => onPick(o.value) }, o.label)));
}
const daySeg = onPick => seg(EVENT.days.map(d => ({ value: d.id, label: `${d.label} ${d.sub}` })), state.day, onPick);

// ---------- 홈 ----------
let cdEls = null;
function renderHome() {
  const v = $("view-home");
  v.textContent = "";
  const first = EVENT.days[0], last = EVENT.days[EVENT.days.length - 1];

  v.append(h("div", { class: "hero" },
    h("div", { class: "hero-art", "aria-hidden": "true" },
      h("img", { class: "float a-ring", src: ART.ring, alt: "" }),
      h("img", { class: "float a-ai", src: ART.ai, alt: "" }),
      h("img", { class: "float a-star", src: ART.star, alt: "" })),
    h("div", { class: "hero-text" },
      h("div", { class: "eyebrow" }, EVENT.eyebrow),
      h("h1", {}, EVENT.title),
      h("p", { class: "tagline" }, EVENT.tagline),
      h("div", { class: "meta-row" },
        h("span", { class: "meta" }, `📅 ${first.date.slice(0, 4)}.${first.sub} – ${last.sub}`),
        h("span", { class: "meta" }, `📍 ${EVENT.venue}`)))));

  const grid = h("div", { class: "stack" });
  const p = phase();

  // 상태 카드: 카운트다운 또는 지금/다음 세션
  const status = h("div", { class: "card" });
  if (p.kind === "before" || p.kind === "between") {
    cdEls = { d: h("div", { class: "cd-num" }, "--"), h: h("div", { class: "cd-num" }, "--"),
              m: h("div", { class: "cd-num" }, "--"), s: h("div", { class: "cd-num" }, "--"), target: p.target.t0 };
    status.append(
      h("div", { class: "countdown-label" }, p.kind === "before" ? "행사 시작까지" : `${p.target.label} 시작까지`),
      h("div", { class: "cd-grid" },
        ["d", "h", "m", "s"].map((k, i) => h("div", { class: "cd-cell" }, cdEls[k], h("div", { class: "cd-unit" }, ["일", "시간", "분", "초"][i])))));
  } else if (p.kind === "live") {
    cdEls = null;
    const t = now();
    const today = EVENT.sessions.filter(s => s.day === p.day.id);
    const cur = today.filter(s => s.t0 <= t && t < s.t1);
    const nextStart = Math.min(...today.filter(s => s.t0 > t).map(s => s.t0));
    const nxt = today.filter(s => s.t0 === nextStart);
    status.append(
      h("div", { class: "now-head" }, h("h3", {}, h("span", { class: "live-dot" }), `지금 진행 중`), h("span", { class: "faint small" }, `${p.day.label} ${p.day.sub}`)),
      cur.length ? sessList(cur) : h("p", { class: "muted small" }, "지금 진행 중인 세션이 없어요."),
      nxt.length ? h("div", { style: "margin-top:16px" },
        h("div", { class: "now-head" }, h("h3", {}, "다음 세션"), h("span", { class: "faint small" }, `${mins(nextStart - t)} 후`)),
        sessList(nxt)) : null,
      h("a", { class: "btn", href: "#program" }, "오늘 전체 일정 보기"));
  } else {
    cdEls = null;
    status.append(h("div", { class: "ended" }, "행사가 종료되었어요. 함께해 주셔서 감사합니다!"));
  }
  grid.append(status);

  // 셔틀 요약 (행사 날짜에만)
  const td = todayDay();
  const homeRow = h("div", { class: "home-grid stack" });
  if (td && p.kind !== "after") {
    const t = now();
    const card = h("div", { class: "card" }, h("div", { class: "section-label" }, "다음 셔틀"));
    const ul = h("ul", { class: "now-list" });
    EVENT.shuttles.forEach(r => {
      const nextT = (r.times[td.id] || []).map(x => at(td.date, x)).find(x => x > t);
      ul.append(h("li", { class: "now-item" },
        h("div", { class: "t" }, r.name),
        h("div", { class: "small muted" }, nextT ? `${fmt(nextT)} 출발 · ${mins(nextT - t)} 후` : "오늘 운행이 끝났어요")));
    });
    card.append(ul, h("a", { class: "btn", href: "#shuttle" }, "셔틀 시간표"));
    homeRow.append(card);
  }

  const notice = h("div", { class: "card" }, h("div", { class: "section-label" }, "공지"),
    h("ul", { class: "notice-list" }, EVENT.notices.map(n => h("li", {}, h("time", {}, n.time), h("span", {}, n.text)))));
  homeRow.append(notice);
  grid.append(homeRow);

  const ico = {
    program: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
    floors: '<path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/>',
    shuttle: '<rect x="4" y="3" width="16" height="14" rx="3"/><path d="M4 11h16M7 17v3M17 17v3"/>',
    join: '<path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/>',
  };
  const q = (href, key, label, sub) => {
    const a = h("a", { href }, h("span", {}, label, h("small", {}, sub)));
    a.insertAdjacentHTML("afterbegin", `<svg viewBox="0 0 24 24">${ico[key]}</svg>`);
    return a;
  };
  grid.append(h("div", { class: "quick" },
    q("#program", "program", "프로그램", `발표 · 전시 ${EXHIBITS.length}개`),
    q("#floors", "floors", "층별 안내", "강연장·편의시설"),
    q("#shuttle", "shuttle", "셔틀", "시간표·탑승 위치"),
    q("#join", "join", "참여 방법", "체크인·FAQ")));

  v.append(grid);
  tickCountdown();
}

function sessList(list) {
  return h("ul", { class: "now-list" }, list.map(s => h("li", { class: "now-item" },
    h("div", {}, badge(s.track), " ", h("span", { class: "faint small" }, `${s.start}–${s.end}`)),
    h("div", { class: "t" }, s.title),
    h("div", { class: "small muted" }, s.speaker ? `${s.speaker} · ` : "", roomLink(s.room)))));
}
const fmt = t => { const d = new Date(t + 9 * 3600e3); return `${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}`; };
function mins(ms) {
  const m = Math.max(0, Math.ceil(ms / 60000));
  return m >= 60 ? `${Math.floor(m / 60)}시간 ${m % 60}분` : `${m}분`;
}

// ---------- 프로그램 ----------
function renderProgram() {
  const v = $("view-program");
  v.textContent = "";
  v.append(pageHead("프로그램", ART.layers));
  v.append(h("div", { class: "toolbar" },
    seg([{ value: "talk", label: "발표" }, { value: "exhibit", label: `전시 ${EXHIBITS.length}` }], state.view, x => {
      state.view = x;
      history.replaceState(null, "", "#program/" + x);
      renderProgram();
    }),
    state.view === "talk" ? daySeg(x => { state.day = x; renderProgram(); }) : null));

  if (state.view === "exhibit") { renderExhibits(v); return; }

  const card = h("div", { class: "card" });

  const used = [...new Set(EVENT.sessions.filter(s => s.day === state.day).map(s => s.track))];
  v.append(h("div", { class: "chips" },
    h("button", { class: "chip", "aria-pressed": String(state.track === "all"), onclick: () => { state.track = "all"; renderProgram(); } }, "전체"),
    Object.keys(EVENT.tracks).filter(k => used.includes(k)).map(k =>
      h("button", { class: "chip", style: `--c:${track(k).color}`, "aria-pressed": String(state.track === k), onclick: () => { state.track = k; renderProgram(); } }, track(k).name))));

  const t = now();
  const list = EVENT.sessions
    .filter(s => s.day === state.day && (state.track === "all" || s.track === state.track))
    .sort((a, b) => a.t0 - b.t0 || a.t1 - b.t1);
  const ol = h("ol", { class: "timeline" });
  list.forEach(s => {
    const cls = "sess" + (s.t0 <= t && t < s.t1 ? " is-now" : t >= s.t1 ? " is-past" : "");
    ol.append(h("li", { class: cls },
      h("div", { class: "when" }, s.start, h("small", {}, `~${s.end}`)),
      h("div", {},
        badge(s.track), s.t0 <= t && t < s.t1 ? h("span", { class: "small", style: "margin-left:8px;color:var(--live);font-weight:700" }, h("span", { class: "live-dot" }), "진행 중") : null,
        h("div", { class: "title" }, s.title),
        s.speaker ? h("div", { class: "who" }, s.speaker) : null,
        s.desc ? h("div", { class: "desc" }, s.desc) : null,
        h("div", { class: "where" }, "📍 ", roomLink(s.room)))));
  });
  card.append(list.length ? ol : h("div", { class: "empty" }, "해당하는 세션이 없어요."));
  v.append(card);
}

// ---------- 전시 목록 (상세: agenda01 ~ agenda28) ----------
function renderExhibits(v) {
  v.append(h("p", { class: "muted small", style: "margin:-4px 0 12px" }, `📍 ${EXHIBIT_PLACE} · ${EXHIBIT_HOURS}`));
  v.append(h("div", { class: "chips" },
    h("button", { class: "chip", "aria-pressed": String(state.part === "all"), onclick: () => { state.part = "all"; renderProgram(); } }, `전체 ${EXHIBITS.length}`),
    Object.entries(PARTS).map(([k, p]) =>
      h("button", { class: "chip", style: `--c:${p.color}`, "aria-pressed": String(state.part === k), onclick: () => { state.part = k; renderProgram(); } },
        `${p.name} ${EXHIBITS.filter(e => e.part === k).length}`))));

  const parts = Object.entries(PARTS).filter(([k]) => state.part === "all" || state.part === k);
  parts.forEach(([k, p]) => {
    const list = EXHIBITS.filter(e => e.part === k);
    if (!list.length) return;
    v.append(h("section", { class: "ex-part", style: `--c:${p.color}` },
      h("div", { class: "ex-part-head" },
        p.icon ? h("img", { src: p.icon, alt: "" }) : null,
        h("h3", {}, p.name), h("span", { class: "muted small" }, `${list.length}개`)),
      h("div", { class: "ex-grid" }, list.map(e =>
        h("a", { class: "ex-card", href: e.id },
          h("div", { class: "ex-top" },
            h("span", { class: "ex-no" }, `Agenda ${exNo(e)}`),
            e.label || e.booth ? h("span", { class: "badge", style: `--c:${p.color}` }, e.label || e.booth) : null),
          h("div", { class: "ex-title" }, exTitles(e).map(t => h("span", {}, t))),
          h("div", { class: "ex-team" }, exTeam(e)),
          e.summary ? h("div", { class: "ex-sum" }, e.summary) : null,
          h("div", { class: "ex-more" }, "자세히 보기 →"))))));
  });
}

// ---------- 층별 안내 ----------
function renderFloors() {
  const v = $("view-floors");
  v.textContent = "";
  v.append(pageHead("층별 안내", ART.cursor));
  v.append(h("div", { class: "floor-tabs" }, EVENT.floors.map(f =>
    h("button", { "aria-pressed": String(f.id === state.floor), onclick: () => { state.floor = f.id; state.highlightRoom = null; renderFloors(); } }, f.id))));

  const f = EVENT.floors.find(x => x.id === state.floor);
  const card = h("div", { class: "card stack" });
  card.append(h("div", { class: "section-label" }, `${f.name} (${f.id})`));
  if (f.map) card.append(h("img", { class: "floor-map", src: f.map, alt: `${f.name} 평면도` }));

  const t = now(), td = todayDay();
  const rooms = Object.entries(EVENT.rooms).filter(([, r]) => r.floor === f.id);
  const grid = h("div", { class: "rooms" });
  rooms.forEach(([k, r]) => {
    let live = null;
    if (td) {
      const ss = EVENT.sessions.filter(s => s.room === k && s.day === td.id).sort((a, b) => a.t0 - b.t0);
      const cur = ss.find(s => s.t0 <= t && t < s.t1);
      const nxt = ss.find(s => s.t0 > t);
      if (cur) live = h("div", { class: "live" }, h("span", { class: "live-dot" }), `지금: ${cur.title}`);
      else if (nxt) live = h("div", { class: "live muted" }, `다음: ${nxt.start} ${nxt.title}`);
    }
    grid.append(h("div", { class: "room" + (state.highlightRoom === k ? " hl-room" : "") },
      h("h3", {}, r.name), h("div", { class: "d" }, r.desc || ""), live));
  });
  card.append(rooms.length ? grid : h("p", { class: "muted small" }, "이 층에는 행사 공간이 없어요."));
  if (f.facilities && f.facilities.length) {
    card.append(h("div", {}, h("div", { class: "section-label", style: "margin-top:4px" }, "편의시설"),
      h("ul", { class: "facilities" }, f.facilities.map(x => h("li", {}, x)))));
  }
  v.append(card);

  v.append(h("div", { class: "card", style: "margin-top:16px" },
    h("div", { class: "section-label" }, "오시는 길"),
    h("div", { style: "font-weight:700" }, EVENT.venue),
    h("div", { class: "muted small" }, EVENT.venueAddress),
    EVENT.mapUrl ? h("a", { class: "btn", href: EVENT.mapUrl, target: "_blank", rel: "noopener" }, "지도에서 보기") : null));
}

// ---------- 셔틀 ----------
function renderShuttle() {
  const v = $("view-shuttle");
  v.textContent = "";
  v.append(pageHead("셔틀 버스", ART.ring));
  v.append(h("div", { class: "toolbar" }, daySeg(x => { state.day = x; renderShuttle(); })));

  const d = dayOf(state.day), t = now();
  const isToday = todayDay() && todayDay().id === d.id;
  const grid = h("div", { class: "stack shuttle-grid", style: "display:grid" });
  EVENT.shuttles.forEach(r => {
    const times = r.times[d.id] || [];
    const abs = times.map(x => at(d.date, x));
    const nextIdx = isToday ? abs.findIndex(x => x > t) : -1;
    grid.append(h("div", { class: "card route" },
      h("h3", {}, r.name),
      h("div", { class: "stop" }, `🚏 ${r.stop}`),
      isToday ? h("div", { class: "next-bus" },
        nextIdx >= 0 ? [h("span", {}, "다음 출발"), h("span", {}, h("b", {}, times[nextIdx]), h("span", { class: "muted small" }, ` · ${mins(abs[nextIdx] - t)} 후`))]
                     : [h("span", {}, "오늘 운행이 끝났어요")]) : null,
      h("div", { class: "times" }, times.map((x, i) =>
        h("span", { class: isToday && abs[i] <= t ? "past" : i === nextIdx ? "next" : "" }, x))),
      r.mapUrl ? h("a", { class: "btn", href: r.mapUrl, target: "_blank", rel: "noopener" }, "탑승 위치 지도") : null));
  });
  v.append(grid);
  v.append(h("p", { class: "muted small", style: "margin-top:16px" }, "※ " + EVENT.shuttleNote));
}

// ---------- 참여 방법 ----------
function renderJoin() {
  const v = $("view-join");
  v.textContent = "";
  v.append(pageHead("참여 방법", ART.star));
  v.append(h("div", { class: "stack" },
    h("div", { class: "card" }, h("div", { class: "section-label" }, "이렇게 참여해요"),
      h("ol", { class: "steps" }, EVENT.steps.map(s => h("li", {}, h("div", {}, h("h3", {}, s.title), h("p", {}, s.desc)))))),
    h("div", { class: "card" }, h("div", { class: "section-label" }, "자주 묻는 질문"),
      EVENT.faq.map(f => h("details", {}, h("summary", {}, f.q), h("p", {}, f.a)))),
    h("div", { class: "card" }, h("div", { class: "section-label" }, "문의"),
      h("div", { class: "contact" },
        h("div", { style: "font-weight:700" }, EVENT.contact.name),
        h("a", { href: `tel:${EVENT.contact.phone.replace(/[^0-9+]/g, "")}` }, `📞 ${EVENT.contact.phone}`),
        h("a", { href: `mailto:${EVENT.contact.email}` }, `✉️ ${EVENT.contact.email}`)))));
}

// ---------- 라우팅 ----------
const renderers = { home: renderHome, program: renderProgram, floors: renderFloors, shuttle: renderShuttle, join: renderJoin };
function route() {
  const [tab, sub] = (location.hash || "#home").slice(1).split("/");
  state.tab = renderers[tab] ? tab : "home";
  if (state.tab === "program" && (sub === "talk" || sub === "exhibit")) state.view = sub;
  document.querySelectorAll(".tab").forEach(a => { if (a.dataset.tab === state.tab) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  document.querySelectorAll(".view").forEach(s => s.classList.toggle("active", s.id === "view-" + state.tab));
  renderers[state.tab]();
}
window.addEventListener("hashchange", () => { route(); window.scrollTo(0, 0); });

// ---------- 시계 ----------
function tickCountdown() {
  if (!cdEls) return;
  let s = Math.max(0, Math.floor((cdEls.target - now()) / 1000));
  const d = Math.floor(s / 86400); s %= 86400;
  const hh = Math.floor(s / 3600); s %= 3600;
  const mm = Math.floor(s / 60); s %= 60;
  cdEls.d.textContent = d; cdEls.h.textContent = pad(hh); cdEls.m.textContent = pad(mm); cdEls.s.textContent = pad(s);
}
function tickPill() {
  const p = phase(), pill = $("status-pill");
  pill.textContent = "";
  if (p.kind === "before" || p.kind === "between") {
    let s = Math.floor((p.target.t0 - now()) / 1000);
    const d = Math.floor(s / 86400); s %= 86400;
    pill.append(h("strong", {}, d > 0 ? `D-${d}` : p.target.label), ` ${pad(Math.floor(s / 3600))}:${pad(Math.floor(s % 3600 / 60))}:${pad(s % 60)}`);
  } else if (p.kind === "live") {
    pill.append(h("span", { class: "live-dot" }), h("strong", {}, `${p.day.label} 진행 중`));
  } else {
    pill.textContent = "행사 종료";
  }
}

let lastPhase = phase().kind, lastMinute = Math.floor(now() / 60000);
setInterval(() => {
  tickCountdown();
  tickPill();
  // 상태가 바뀌거나 1분이 지나면 '지금/다음' 정보가 있는 화면을 다시 그림
  const k = phase().kind, m = Math.floor(now() / 60000);
  if (k !== lastPhase || m !== lastMinute) {
    lastPhase = k; lastMinute = m;
    if (state.tab !== "join") renderers[state.tab]();
  }
}, 1000);

// ---------- 시작 ----------
$("brand").append(h("b", {}, EVENT.title));
$("footer").textContent = EVENT.footer;
$("sample-banner").hidden = !EVENT.sample;
document.title = EVENT.title;
tickPill();
route();
</script>
</body>
</html>
