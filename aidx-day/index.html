<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070f">
<title>AID-X Day</title>
<meta name="description" content="AID-X Day 행사 안내">
<style>
  :root {
    --bg-0: #05070f;
    --bg-1: #0a0f1f;
    --panel: rgba(13, 20, 40, 0.78);
    --panel-solid: #0d1428;
    --ink: #eaf0ff;
    --ink-dim: #9fb0d9;
    --accent: #35e0ff;
    --accent-2: #7c5cff;
    --border: rgba(140, 170, 255, 0.18);
    --ph-bg: rgba(255, 210, 92, 0.16);
    --ph-ink: #ffd25c;
    --radius: 18px;
    --gutter: 16px;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 88px; }
  html, body { margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: var(--bg-0);
    color: var(--ink);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", system-ui, sans-serif;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    word-break: keep-all;
    overflow-x: hidden;
  }

  /* 배경: 격자 + 빛 번짐 */
  .bg {
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
      radial-gradient(60% 50% at 15% 0%, rgba(124, 92, 255, 0.30), transparent 70%),
      radial-gradient(50% 45% at 90% 15%, rgba(53, 224, 255, 0.16), transparent 70%),
      radial-gradient(60% 50% at 50% 110%, rgba(124, 92, 255, 0.14), transparent 70%),
      var(--bg-0);
  }
  .bg::after {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(140, 170, 255, 0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(140, 170, 255, 0.06) 1px, transparent 1px);
    background-size: 48px 48px;
    -webkit-mask-image: radial-gradient(80% 60% at 50% 20%, #000 30%, transparent 80%);
            mask-image: radial-gradient(80% 60% at 50% 20%, #000 30%, transparent 80%);
  }

  .container {
    width: 100%;
    max-width: 1120px;
    margin: 0 auto;
    padding: 0 var(--gutter);
  }

  /* 자리표시자: 실제 내용으로 바꿔야 하는 부분 */
  .ph {
    background: var(--ph-bg);
    color: var(--ph-ink);
    border-radius: 4px;
    padding: 0 4px;
    box-decoration-break: clone;
    -webkit-box-decoration-break: clone;
  }

  /* ---------- 상단 바 ---------- */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    background: rgba(5, 7, 15, 0.78);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding-top: env(safe-area-inset-top);
  }
  .topbar .container {
    display: flex;
    align-items: center;
    gap: 16px;
    height: 56px;
  }
  .brand {
    font-weight: 900;
    letter-spacing: -0.01em;
    font-size: 17px;
    color: var(--ink);
    text-decoration: none;
    white-space: nowrap;
  }
  .brand b {
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .nav { display: none; gap: 4px; margin-left: 16px; }
  .nav a {
    color: var(--ink-dim);
    text-decoration: none;
    font-size: 14px;
    padding: 6px 12px;
    border-radius: 999px;
  }
  .nav a:hover { color: var(--ink); background: rgba(140, 170, 255, 0.1); }

  /* 상단 바 안의 작은 카운트다운 (모바일, 또는 PC에서 히어로를 지나 스크롤했을 때) */
  .mini-cd {
    margin-left: auto;
    font-size: 13px;
    color: var(--ink-dim);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    transition: opacity .25s;
  }
  .mini-cd strong { color: var(--accent); font-weight: 800; }

  /* ---------- 히어로 ---------- */
  .hero { padding: 28px 0 8px; }
  .hero-grid { display: grid; gap: 24px; }
  .hero-text { text-align: center; }
  .eyebrow {
    display: inline-block;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.14em;
    color: var(--accent);
    border: 1px solid rgba(53, 224, 255, 0.4);
    border-radius: 999px;
    padding: 4px 12px;
    margin-bottom: 14px;
  }
  h1 {
    margin: 0 0 12px;
    font-size: clamp(40px, 11vw, 88px);
    line-height: 1.02;
    font-weight: 900;
    letter-spacing: -0.03em;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .tagline { margin: 0; color: var(--ink-dim); font-size: clamp(15px, 2vw, 19px); }
  .hero-meta {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin-top: 18px;
  }
  .chip {
    font-size: 13px;
    padding: 6px 12px;
    border-radius: 999px;
    background: rgba(140, 170, 255, 0.08);
    border: 1px solid var(--border);
  }

  /* ---------- 카운트다운 ---------- */
  .countdown {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    box-shadow: 0 0 60px rgba(53, 224, 255, 0.08);
  }
  .countdown-label {
    font-size: 12px;
    letter-spacing: 0.1em;
    color: var(--ink-dim);
    text-align: center;
    margin-bottom: 10px;
  }
  .countdown-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .cd-cell {
    background: rgba(5, 7, 15, 0.6);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 0 8px;
    text-align: center;
  }
  .cd-num {
    font-size: clamp(26px, 8vw, 48px);
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    color: var(--accent);
    line-height: 1.05;
  }
  .cd-unit { font-size: 12px; color: var(--ink-dim); }
  .countdown-live {
    display: none;
    text-align: center;
    font-size: 22px;
    font-weight: 800;
    color: var(--accent);
    padding: 12px 0;
  }
  .countdown.is-live .countdown-grid { display: none; }
  .countdown.is-live .countdown-live { display: block; }

  /* ---------- 본문 카드 ---------- */
  .content {
    display: grid;
    gap: 16px;
    padding-top: 24px;
    padding-bottom: 8px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 18px;
  }
  .card h2 {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0 0 14px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.12em;
    color: var(--accent);
  }
  .card h2::before {
    content: "";
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 10px var(--accent);
  }

  .facts { margin: 0; display: grid; gap: 14px; }
  .fact { display: grid; grid-template-columns: 56px 1fr; gap: 8px; }
  .fact dt { color: var(--ink-dim); font-size: 14px; }
  .fact dd { margin: 0; font-size: 15px; font-weight: 600; }
  .fact dd small { display: block; font-weight: 400; color: var(--ink-dim); font-size: 13px; margin-top: 2px; }

  .btn {
    display: block;
    text-align: center;
    margin-top: 16px;
    padding: 12px;
    border-radius: 12px;
    font-weight: 700;
    font-size: 15px;
    text-decoration: none;
    color: var(--bg-0);
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    transition: transform .15s, box-shadow .15s;
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 6px 24px rgba(53, 224, 255, 0.25); }
  .btn.ghost { color: var(--ink); background: transparent; border: 1px solid var(--border); }

  .timeline { list-style: none; margin: 0; padding: 0; position: relative; }
  .timeline li {
    position: relative;
    display: grid;
    grid-template-columns: 64px 1fr;
    gap: 8px 12px;
    padding: 12px 0;
    border-top: 1px solid var(--border);
  }
  .timeline li:first-child { border-top: 0; padding-top: 0; }
  .timeline time {
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    color: var(--accent);
    font-size: 14px;
  }
  .timeline .title { font-weight: 600; font-size: 15px; }
  .timeline .desc { color: var(--ink-dim); font-size: 13px; }
  .timeline li.is-now {
    background: rgba(53, 224, 255, 0.08);
    margin: 0 -18px;
    padding-left: 18px;
    padding-right: 18px;
    box-shadow: inset 3px 0 0 var(--accent);
  }
  .timeline li.is-now .title::after {
    content: "진행 중";
    margin-left: 6px;
    font-size: 11px;
    font-weight: 700;
    color: var(--bg-0);
    background: var(--accent);
    border-radius: 999px;
    padding: 1px 7px;
    vertical-align: 2px;
  }

  .notes { margin: 0; padding-left: 18px; }
  .notes li { margin: 6px 0; font-size: 14px; }

  footer {
    padding-top: 32px;
    padding-bottom: max(32px, env(safe-area-inset-bottom));
    text-align: center;
    font-size: 12px;
    color: var(--ink-dim);
  }

  /* =====================================================================
     태블릿 이상
     ===================================================================== */
  @media (min-width: 720px) {
    :root { --gutter: 32px; }
    .content { grid-template-columns: 1fr 1fr; gap: 20px; }
    .card-program { grid-column: 1 / -1; }
  }

  /* =====================================================================
     PC: 히어로 2단(제목 | 카운트다운), 본문 2단(정보·안내·문의 | 프로그램)
     ===================================================================== */
  @media (min-width: 1000px) {
    .nav { display: flex; }
    .hero { padding: 72px 0 24px; }
    .hero-grid { grid-template-columns: 1.15fr 1fr; align-items: center; gap: 48px; }
    .hero-text { text-align: left; }
    .hero-meta { justify-content: flex-start; }
    .countdown { padding: 24px; }
    .cd-cell { padding: 16px 0 12px; }
    .cd-num { font-size: 52px; }

    /* 히어로에 큰 카운트다운이 보일 때는 상단 바의 작은 카운트다운 숨김 */
    body:not(.scrolled) .mini-cd { opacity: 0; }

    .content {
      grid-template-columns: 5fr 7fr;
      grid-template-areas:
        "info    program"
        "notes   program"
        "contact program";
      grid-template-rows: auto auto 1fr;
      gap: 24px;
      padding-top: 40px;
    }
    .card { padding: 26px 26px; }
    .card-info    { grid-area: info; }
    .card-notes   { grid-area: notes; }
    .card-contact { grid-area: contact; align-self: start; }
    .card-program { grid-area: program; grid-column: auto; align-self: start; }

    .timeline li { grid-template-columns: 80px 1fr; padding: 16px 0; }
    .timeline li.is-now { margin: 0 -26px; padding-left: 26px; padding-right: 26px; }
    .timeline time { font-size: 16px; }
    .timeline .title { font-size: 17px; }
    .timeline .desc { font-size: 14px; }
    .fact { grid-template-columns: 64px 1fr; }
    .fact dd { font-size: 16px; }
    .btn { display: inline-block; padding: 11px 22px; }
  }
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>

<header class="topbar">
  <div class="container">
    <a class="brand" href="#top" id="brand"></a>
    <nav class="nav" aria-label="섹션">
      <a href="#info">행사 정보</a>
      <a href="#program">프로그램</a>
      <a href="#notes">안내 사항</a>
      <a href="#contact">문의</a>
    </nav>
    <div class="mini-cd" id="mini-cd" aria-hidden="true"></div>
  </div>
</header>

<main id="top">
  <section class="hero">
    <div class="container hero-grid">
      <div class="hero-text">
        <div class="eyebrow" id="eyebrow"></div>
        <h1 id="title"></h1>
        <p class="tagline" id="tagline"></p>
        <div class="hero-meta">
          <span class="chip" id="chip-date"></span>
          <span class="chip" id="chip-venue"></span>
        </div>
      </div>

      <div class="countdown" id="countdown" aria-live="polite">
        <div class="countdown-label" id="cd-label">행사 시작까지</div>
        <div class="countdown-grid">
          <div class="cd-cell"><div class="cd-num" id="cd-d">--</div><div class="cd-unit">일</div></div>
          <div class="cd-cell"><div class="cd-num" id="cd-h">--</div><div class="cd-unit">시간</div></div>
          <div class="cd-cell"><div class="cd-num" id="cd-m">--</div><div class="cd-unit">분</div></div>
          <div class="cd-cell"><div class="cd-num" id="cd-s">--</div><div class="cd-unit">초</div></div>
        </div>
        <div class="countdown-live" id="cd-live"></div>
      </div>
    </div>
  </section>

  <div class="container content">
    <section class="card card-info" id="info">
      <h2>행사 정보</h2>
      <dl class="facts" id="facts"></dl>
      <a class="btn" id="map-btn" target="_blank" rel="noopener">지도에서 보기</a>
    </section>

    <section class="card card-program" id="program">
      <h2>프로그램</h2>
      <ol class="timeline" id="program-list"></ol>
    </section>

    <section class="card card-notes" id="notes">
      <h2>안내 사항</h2>
      <ul class="notes" id="notes-list"></ul>
    </section>

    <section class="card card-contact" id="contact">
      <h2>문의</h2>
      <dl class="facts" id="contact-list"></dl>
      <a class="btn ghost" id="link-btn" target="_blank" rel="noopener"></a>
    </section>
  </div>
</main>

<footer class="container" id="footer"></footer>

<script>
/* =====================================================================
   행사 정보 — 이 블록만 고치면 페이지 전체에 반영돼요.
   [대괄호]로 된 값은 자리표시자라 페이지에서 노란색으로 표시돼요.
   ===================================================================== */
const EVENT = {
  eyebrow: "2026 AID-X",
  title: "AID-X Day",
  tagline: "[행사 한 줄 소개]",

  // 카운트다운 기준 시각 (한국 시간 기준 +09:00 유지)
  startISO: "2026-10-15T14:00:00+09:00",
  endISO:   "2026-10-15T18:00:00+09:00",

  dateText: "[2026년 10월 15일 (목)]",
  timeText: "[14:00 – 18:00]",
  venue:    "[장소 이름]",
  venueDetail: "[상세 주소 / 층·호실]",
  mapUrl:   "",   // 예: "https://naver.me/xxxx" — 비워 두면 지도 버튼이 숨겨져요
  target:   "[참석 대상]",

  // 시간은 "HH:MM" (startISO와 같은 날짜로 계산해서 '진행 중' 표시)
  program: [
    { time: "[14:00]", title: "[오프닝]",        desc: "[설명]" },
    { time: "[14:20]", title: "[세션 1]",        desc: "[발표자 / 설명]" },
    { time: "[15:10]", title: "[휴식]",          desc: "" },
    { time: "[15:30]", title: "[세션 2]",        desc: "[발표자 / 설명]" },
    { time: "[16:30]", title: "[시상 및 네트워킹]", desc: "[설명]" },
    { time: "[18:00]", title: "[폐회]",          desc: "" },
  ],

  notes: [
    "[준비물 또는 사전 안내]",
    "[주차 / 교통 안내]",
    "[식사·다과 안내]",
  ],

  contactName:  "[담당자 이름]",
  contactPhone: "[연락처]",
  contactEmail: "[이메일]",

  linkLabel: "[신청 / 자료 링크]",
  linkUrl:   "",   // 비워 두면 링크 버튼이 숨겨져요

  footer: "© 2026 AID-X",
};
/* ===================================================================== */

// "[...]" 부분을 노란 자리표시자로 감싸서 렌더링
function render(el, text) {
  el.textContent = "";
  String(text).split(/(\[[^\]]*\])/).forEach(part => {
    if (!part) return;
    if (/^\[[^\]]*\]$/.test(part)) {
      const span = document.createElement("span");
      span.className = "ph";
      span.textContent = part;
      el.appendChild(span);
    } else {
      el.appendChild(document.createTextNode(part));
    }
  });
  return el;
}
const $ = id => document.getElementById(id);
const make = (tag, cls) => { const e = document.createElement(tag); if (cls) e.className = cls; return e; };

function fact(dl, label, main, sub) {
  const row = make("div", "fact");
  row.appendChild(render(make("dt"), label));
  const dd = render(make("dd"), main);
  if (sub) dd.appendChild(render(make("small"), sub));
  row.appendChild(dd);
  dl.appendChild(row);
}

render($("brand"), EVENT.title);
render($("eyebrow"), EVENT.eyebrow);
render($("title"), EVENT.title);
render($("tagline"), EVENT.tagline);
render($("chip-date"), "📅 " + EVENT.dateText);
render($("chip-venue"), "📍 " + EVENT.venue);
document.title = EVENT.title.replace(/[\[\]]/g, "");

fact($("facts"), "일시", EVENT.dateText, EVENT.timeText);
fact($("facts"), "장소", EVENT.venue, EVENT.venueDetail);
fact($("facts"), "대상", EVENT.target);

if (EVENT.mapUrl) $("map-btn").href = EVENT.mapUrl; else $("map-btn").remove();

EVENT.program.forEach(p => {
  const li = make("li");
  li.dataset.time = p.time.replace(/[\[\]]/g, "");
  li.appendChild(render(make("time"), p.time));
  const body = make("div");
  body.appendChild(render(make("div", "title"), p.title));
  if (p.desc) body.appendChild(render(make("div", "desc"), p.desc));
  li.appendChild(body);
  $("program-list").appendChild(li);
});

EVENT.notes.forEach(n => $("notes-list").appendChild(render(make("li"), n)));

fact($("contact-list"), "담당", EVENT.contactName);
fact($("contact-list"), "전화", EVENT.contactPhone);
fact($("contact-list"), "메일", EVENT.contactEmail);

if (EVENT.linkUrl) {
  render($("link-btn"), EVENT.linkLabel);
  $("link-btn").href = EVENT.linkUrl;
} else {
  $("link-btn").remove();
}

render($("footer"), EVENT.footer);

// PC: 히어로의 큰 카운트다운이 화면에서 벗어나면 상단 바에 작은 카운트다운 표시
if ("IntersectionObserver" in window) {
  new IntersectionObserver(([e]) => {
    document.body.classList.toggle("scrolled", !e.isIntersecting);
  }, { rootMargin: "-56px 0px 0px 0px" }).observe($("countdown"));
}

// ---------- 카운트다운 + 진행 중 표시 ----------
const start = new Date(EVENT.startISO).getTime();
const end = new Date(EVENT.endISO).getTime();
const tz = EVENT.startISO.slice(19) || "+09:00";
const day = EVENT.startISO.slice(0, 10);
const slots = [...$("program-list").children].map(li => ({
  li, at: /^\d{1,2}:\d{2}$/.test(li.dataset.time)
    ? new Date(`${day}T${li.dataset.time.padStart(5, "0")}:00${tz}`).getTime()
    : NaN
}));
const pad = n => String(n).padStart(2, "0");

function tick() {
  const now = Date.now();
  const cd = $("countdown");
  const mini = $("mini-cd");

  if (now < start) {
    let s = Math.floor((start - now) / 1000);
    const d = Math.floor(s / 86400); s %= 86400;
    const h = Math.floor(s / 3600);  s %= 3600;
    const m = Math.floor(s / 60);    s %= 60;
    $("cd-d").textContent = d;
    $("cd-h").textContent = pad(h);
    $("cd-m").textContent = pad(m);
    $("cd-s").textContent = pad(s);
    cd.classList.remove("is-live");
    mini.innerHTML = `<strong>D-${d}</strong> ${pad(h)}:${pad(m)}:${pad(s)}`;
  } else {
    const live = now < end;
    cd.classList.add("is-live");
    $("cd-label").textContent = live ? "지금" : "";
    $("cd-live").textContent = live ? "행사 진행 중" : "행사가 종료되었어요. 감사합니다!";
    mini.innerHTML = live ? "<strong>진행 중</strong>" : "종료";
  }

  // 현재 진행 중인 프로그램 강조
  let current = null;
  if (now >= start && now < end) {
    slots.forEach(s => { if (!isNaN(s.at) && s.at <= now) current = s.li; });
  }
  slots.forEach(s => s.li.classList.toggle("is-now", s.li === current));
}
tick();
setInterval(tick, 1000);
</script>
</body>
</html>
