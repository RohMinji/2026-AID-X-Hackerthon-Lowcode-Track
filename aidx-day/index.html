<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a1f">
<title>AID-X Day</title>
<meta name="description" content="AID-X Day 행사 안내 — 프로그램, 층별 안내, 오시는 길, 이벤트">
<style>
  :root {
    --bg-0: #0a0a1f;
    --panel: rgba(255, 255, 255, 0.045);
    --panel-2: rgba(255, 255, 255, 0.03);
    --surface: rgba(255, 255, 255, 0.05);
    --glass: rgba(255, 255, 255, 0.06);
    --ink: #eef0ff;
    --ink-dim: #a3a8d6;
    --ink-faint: #6f74a3;
    --accent: #948bff;
    --accent-2: #b48cff;
    --grad: linear-gradient(100deg, #5b7cff 0%, #7b5cff 50%, #b57bff 100%);
    --border: rgba(160, 150, 255, 0.16);
    --shadow: 0 12px 34px rgba(0, 0, 0, 0.35);
    --warn-bg: rgba(255, 200, 80, 0.10);
    --warn-ink: #ffd27a;
    --live: #3ee0a0;
    --radius: 20px;
    --gutter: 16px;
    --tabbar-h: 64px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: var(--bg-0);
    color: var(--ink);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", system-ui, sans-serif;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    word-break: keep-all;
    overflow-x: hidden;
  }
  a { color: inherit; }
  button { font: inherit; color: inherit; }

  /* 배경: 라벤더 화이트 + 파랑·보라 빛 번짐 + 점 격자 */
  .bg {
    position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(55% 45% at 8% 0%, rgba(100, 70, 255, 0.30), transparent 70%),
      radial-gradient(45% 40% at 100% 10%, rgba(60, 110, 255, 0.20), transparent 70%),
      radial-gradient(60% 45% at 60% 100%, rgba(150, 90, 255, 0.16), transparent 70%),
      var(--bg-0);
  }
  .bg::after {
    content: ""; position: absolute; inset: 0;
    background-image: radial-gradient(rgba(170, 160, 255, 0.10) 1px, transparent 1.2px);
    background-size: 22px 22px;
    -webkit-mask-image: radial-gradient(80% 60% at 50% 15%, #000 20%, transparent 75%);
            mask-image: radial-gradient(80% 60% at 50% 15%, #000 20%, transparent 75%);
  }
  .grad-text {
    background: var(--grad);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }

  /* ---------- 상단 바 ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 30;
    background: rgba(10, 10, 31, 0.72);
    backdrop-filter: blur(16px) saturate(1.4); -webkit-backdrop-filter: blur(16px) saturate(1.4);
    border-bottom: 1px solid var(--border);
    padding-top: env(safe-area-inset-top);
  }
  .topbar-inner {
    max-width: 1200px; margin: 0 auto; padding: 0 var(--gutter);
    height: 56px; display: flex; align-items: center; gap: 12px;
  }
  .brand { display: flex; align-items: center; text-decoration: none; }
  .brand img { height: 22px; width: auto; display: block; }
  .logo-h1 { margin: 0 0 12px; line-height: 0; }
  .logo-h1 img { width: min(100%, 520px); height: auto; }
  .status-pill {
    margin-left: auto; font-size: 13px; color: var(--ink-dim);
    font-variant-numeric: tabular-nums; white-space: nowrap;
    padding: 5px 12px; border-radius: 999px; background: var(--glass); border: 1px solid var(--border);
  }
  .status-pill strong { color: var(--accent); font-weight: 800; }

  .preview-banner {
    background: rgba(140, 110, 255, 0.16); color: #cbbfff;
    font-size: 12px; text-align: center; padding: 6px var(--gutter);
  }

  /* ---------- 레이아웃 ---------- */
  .layout { max-width: 1200px; margin: 0 auto; padding: 0 var(--gutter); }
  main { padding: 20px 0 calc(var(--tabbar-h) + 32px + env(safe-area-inset-bottom)); min-width: 0; }

  /* 탭 바: 모바일은 화면 아래 고정 */
  .tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
    display: grid; grid-template-columns: repeat(5, 1fr);
    height: calc(var(--tabbar-h) + env(safe-area-inset-bottom));
    padding-bottom: env(safe-area-inset-bottom);
    background: rgba(12, 12, 34, 0.9);
    backdrop-filter: blur(16px) saturate(1.4); -webkit-backdrop-filter: blur(16px) saturate(1.4);
    border-top: 1px solid var(--border);
    box-shadow: 0 -6px 24px rgba(0, 0, 0, 0.35);
  }
  .tab {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    text-decoration: none; color: var(--ink-faint); font-size: 11px; font-weight: 600;
  }
  .tab svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .tab[aria-current="page"] { color: var(--accent); }

  .view { display: none; }
  .view.active { display: block; animation: fade .25s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* 떠 있는 유리 오브젝트 */
  @keyframes floaty { 0%, 100% { transform: translateY(0) rotate(var(--r, 0deg)); } 50% { transform: translateY(-10px) rotate(var(--r, 0deg)); } }
  .float { animation: floaty 6s ease-in-out infinite; will-change: transform; }
  @media (prefers-reduced-motion: reduce) { .float, .view.active { animation: none; } }

  .page-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 16px; }
  h2.page-title { margin: 0; font-size: 26px; font-weight: 900; letter-spacing: -0.02em; }
  .page-head img { flex: none; width: 72px; height: auto; margin-right: 4px; pointer-events: none; }

  .section-label {
    display: flex; align-items: center; gap: 8px;
    margin: 0 0 12px; font-size: 13px; font-weight: 800; letter-spacing: 0.08em; color: var(--accent);
  }
  .section-label::before {
    content: ""; width: 8px; height: 8px; border-radius: 3px;
    background: var(--grad); transform: rotate(45deg);
  }

  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 18px;
    box-shadow: var(--shadow);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  }
  .stack { display: grid; gap: 16px; }
  .muted { color: var(--ink-dim); }
  .faint { color: var(--ink-faint); }
  .small { font-size: 13px; }

  /* 세그먼트(일차/보기 전환) */
  .seg {
    display: inline-flex; padding: 4px; gap: 4px;
    background: var(--glass); border: 1px solid var(--border); border-radius: 14px;
    box-shadow: var(--shadow);
  }
  .seg button {
    border: 0; background: transparent; padding: 8px 14px; border-radius: 10px;
    font-size: 14px; font-weight: 700; color: var(--ink-dim); cursor: pointer; white-space: nowrap;
  }
  .seg button[aria-pressed="true"] { background: var(--grad); color: #fff; box-shadow: 0 4px 14px rgba(80, 70, 255, .3); }
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }

  .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 14px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; border: 1px solid var(--border); background: var(--glass);
    padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--ink-dim); cursor: pointer;
  }
  .chip[aria-pressed="true"] { border-color: var(--c, var(--accent)); color: var(--c, var(--accent)); background: color-mix(in srgb, var(--c, var(--accent)) 16%, transparent); }

  .badge {
    display: inline-block; font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 999px;
    color: var(--c); background: color-mix(in srgb, var(--c) 16%, transparent);
    border: 1px solid color-mix(in srgb, var(--c) 30%, transparent);
    white-space: nowrap;
  }
  .live-dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: var(--live); box-shadow: 0 0 0 0 rgba(20, 184, 122, .5);
    animation: pulse 1.6s infinite; margin-right: 6px; vertical-align: 1px;
  }
  @keyframes pulse { 70% { box-shadow: 0 0 0 8px rgba(20, 184, 122, 0); } 100% { box-shadow: 0 0 0 0 rgba(20, 184, 122, 0); } }

  .linkish {
    background: none; border: 0; padding: 0; cursor: pointer;
    color: var(--accent); text-decoration: underline; text-underline-offset: 3px; font-size: inherit; font-weight: 600;
  }

  /* ---------- 홈 ---------- */
  .hero { position: relative; display: grid; gap: 4px; padding: 0 0 20px; }
  .hero-art { position: relative; height: 230px; margin: 0 auto; width: 100%; max-width: 360px; }
  .hero-art img { position: absolute; height: auto; pointer-events: none; user-select: none; }
  .hero-art .a-ai   { width: 43%; left: 44%; top: 0; --r: 8deg; }
  .hero-art .a-ring { width: 30%; left: 8%; top: 42%; --r: -14deg; animation-delay: -2s; animation-duration: 7s; }
  .hero-art .a-star { width: 17%; left: 30%; top: 6%; --r: -12deg; animation-delay: -4s; animation-duration: 5s; }
  .hero-text { text-align: center; }
  .hero h1 { margin: 0 auto 12px; max-width: 420px; }
  .hero .tagline { margin: 0 0 14px; color: var(--ink-dim); font-size: clamp(15px, 2vw, 18px); }
  .meta-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .meta-k { color: var(--accent); font-weight: 900; margin-right: 6px; }
  .meta {
    font-size: 13px; font-weight: 600; padding: 7px 13px; border-radius: 999px;
    background: var(--glass); border: 1px solid var(--border); box-shadow: var(--shadow);
  }

  .countdown-label { font-size: 12px; font-weight: 700; letter-spacing: 0.1em; color: var(--ink-dim); text-align: center; margin-bottom: 10px; }
  .cd-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .cd-cell { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 12px 0 8px; text-align: center;  }
  .cd-num {
    font-size: clamp(28px, 8vw, 48px); font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1.05;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .cd-unit { font-size: 12px; color: var(--ink-dim); }
  .ended { text-align: center; font-size: 20px; font-weight: 800; color: var(--accent); padding: 8px 0; }

  .now-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .now-item { display: grid; gap: 4px; padding: 12px; border-radius: 14px; background: var(--surface); border: 1px solid var(--border); }
  .now-item .t { font-weight: 700; }
  .now-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 10px; }
  .now-head h3 { margin: 0; font-size: 16px; }

  /* 홈: 행사 구성 카드 */
  .zones { margin: 0 calc(-1 * var(--gutter)); min-width: 0; }
  .stack > * { min-width: 0; }
  .zones-track {
    display: grid; grid-auto-flow: column; grid-auto-columns: 86%; gap: 12px;
    overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding: 0 var(--gutter);
    padding: 2px var(--gutter) 6px; scrollbar-width: none;
  }
  .zones-track::-webkit-scrollbar { display: none; }
  .zone-card {
    scroll-snap-align: start; display: flex; flex-direction: column; align-items: center; text-align: center;
    padding: 18px 16px; border-radius: 20px; background: rgba(4, 4, 14, .7); border: 1px solid rgba(255, 255, 255, .14);
  }
  .zone-top { align-self: stretch; display: flex; justify-content: space-between; align-items: center; }
  .zone-no { font-size: 26px; font-weight: 900; letter-spacing: -0.02em; }
  .zone-floor { font-size: 14px; font-weight: 800; color: #fff; padding: 5px 14px; border-radius: 999px; background: linear-gradient(135deg, #5b4bff, #7b4dff); }
  .zone-title { margin: 12px 0 0; font-size: 24px; line-height: 1.12; font-weight: 900; letter-spacing: -0.02em; }
  .zone-title span { display: block; }
  .zone-sub { margin: 12px 0 0; font-size: 14px; font-weight: 800; color: var(--ink); }
  .zone-tag { margin: 6px 0 0; font-size: 13px; font-weight: 800; letter-spacing: .02em; color: var(--zc); }
  .zone-art { width: 110px; height: 110px; object-fit: contain; margin: 14px 0; filter: drop-shadow(0 12px 24px rgba(110, 80, 255, .35)); }
  .zone-desc { margin: 0; font-size: 14px; line-height: 1.75; color: var(--ink); opacity: .9; }
  .zone-rows { align-self: stretch; display: grid; gap: 8px; margin-top: auto; }
  .zone-row {
    display: grid; grid-template-columns: 40px 1fr; gap: 10px; align-items: center; text-align: left;
    padding: 10px 12px; border-radius: 12px; background: rgba(20, 20, 50, .8); border: 1px solid rgba(160, 150, 255, .2);
  }
  .zr-ico svg { width: 30px; height: 30px; fill: none; stroke: #b9b2ff; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
  .zone-row b { display: block; font-size: 14px; font-weight: 900; color: #c4b8ff; }
  .zone-row span { font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .zone-dots { display: flex; justify-content: center; gap: 6px; margin-top: 10px; }
  .zone-dots button { width: 7px; height: 7px; padding: 0; border: 0; border-radius: 999px; background: rgba(255,255,255,.25); cursor: pointer; transition: width .2s; }
  .zone-dots button.on { width: 20px; background: var(--accent); }
  @media (min-width: 1000px) {
    .zones { margin: 0; }
    .zones-track { grid-auto-flow: row; grid-template-columns: repeat(3, 1fr); overflow: visible; padding: 0; gap: 16px; }
    .zone-card { padding: 22px 20px; }
    .zone-title { font-size: 28px; }
    .zone-art { width: 130px; height: 130px; }
    .zone-row { grid-template-columns: 34px 1fr; padding: 10px; }
    .zone-row span { font-size: 12px; }
    .zone-dots { display: none; }
  }

  .quick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .quick a {
    display: flex; align-items: center; gap: 10px; padding: 14px; border-radius: 16px;
    background: var(--panel); border: 1px solid var(--border); text-decoration: none; font-weight: 800; font-size: 15px;
    box-shadow: var(--shadow); transition: transform .15s, border-color .15s;
  }
  .quick a:last-child:nth-child(odd) { grid-column: 1 / -1; }
  .quick a:hover { transform: translateY(-2px); border-color: rgba(88, 80, 255, .35); }
  .quick a svg { width: 22px; height: 22px; stroke: var(--accent); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .quick a span small { display: block; font-weight: 500; font-size: 12px; color: var(--ink-dim); }

  .notice-list { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
  .notice-list li { display: grid; grid-template-columns: auto 1fr; gap: 10px; font-size: 14px; }
  .notice-list time { color: var(--ink-faint); font-size: 12px; font-variant-numeric: tabular-nums; padding-top: 2px; }

  /* ---------- 프로그램 ---------- */
  .timeline { list-style: none; margin: 0; padding: 0; }
  .sess {
    display: grid; grid-template-columns: 58px 1fr; gap: 12px;
    padding: 14px 0; border-top: 1px solid var(--border);
  }
  .sess:first-child { border-top: 0; padding-top: 0; }
  .sess .when { font-variant-numeric: tabular-nums; font-weight: 800; color: var(--accent); font-size: 15px; line-height: 1.2; }
  .sess .when small { display: block; color: var(--ink-faint); font-weight: 500; font-size: 12px; margin-top: 2px; }
  .sess .title { font-weight: 800; font-size: 15px; margin: 4px 0 2px; }
  .sess .who { font-size: 13px; color: var(--ink-dim); }
  .sess .desc { font-size: 13px; color: var(--ink-dim); margin-top: 4px; }
  .sess .where { font-size: 13px; margin-top: 4px; }
  .sess.is-past { opacity: .45; }
  .sess.is-now {
    margin: 0 -18px; padding-left: 18px; padding-right: 18px;
    background: linear-gradient(90deg, rgba(61, 75, 255, .08), rgba(139, 92, 255, .04)); box-shadow: inset 3px 0 0 var(--accent);
  }
  .empty { text-align: center; color: var(--ink-dim); padding: 24px 0; }
  .prog-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 14px; }
  .prog-head h3 { margin: 0; font-size: 18px; font-weight: 900; color: var(--c); letter-spacing: -0.01em; }
  .group-title {
    margin: 18px 0 10px; padding: 8px 12px; border-radius: 10px; font-size: 14px; font-weight: 800;
    background: color-mix(in srgb, var(--c) 12%, transparent); color: var(--c);
  }
  .prog-head + .group-title { margin-top: 0; }
  .sess.is-break .title { color: var(--ink-dim); font-weight: 600; }
  .slots { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .slots span {
    font-size: 13px; font-variant-numeric: tabular-nums; padding: 3px 9px; border-radius: 8px;
    background: var(--surface); border: 1px solid var(--border); color: var(--ink-dim);
  }
  .slots span.on { color: #fff; background: var(--grad); border-color: transparent; font-weight: 700; }
  .slots span.past { opacity: .45; text-decoration: line-through; }

  /* 발표 세션표 */
  .talks .tr { display: grid; grid-template-columns: 58px 1fr; gap: 12px; padding: 12px 0; border-top: 1px solid var(--border); }
  .talks .tr-head { display: none; }
  .talks .when { font-variant-numeric: tabular-nums; font-weight: 800; color: var(--accent); font-size: 15px; line-height: 1.2; padding-top: 10px; }
  .talks .when small { display: block; color: var(--ink-faint); font-weight: 500; font-size: 12px; margin-top: 2px; }
  .tr-cells { display: grid; gap: 8px; min-width: 0; }
  .tz { padding: 8px 12px; border-radius: 10px; font-size: 14px; font-weight: 800; color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); }
  .tc { padding: 10px 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border); box-shadow: inset 3px 0 0 var(--c); min-width: 0; }
  .tc.empty { display: none; }
  .tc-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
  .tc-title { font-size: 15px; font-weight: 800; margin-top: 6px; line-height: 1.4; }
  .tc.is-now { border-color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); }
  .tc.is-past { opacity: .5; }
  .tc.is-break { background: transparent; border-style: dashed; box-shadow: none; }
  .tc.is-break .tc-title { color: var(--ink-dim); font-weight: 600; }

  /* AX Tech Connect 목록 */
  .connect-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .connect-list li {
    display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: center;
    padding: 12px 14px; border-radius: 14px; background: var(--panel); border: 1px solid var(--border);
    box-shadow: inset 3px 0 0 var(--c);
  }
  .connect-list .n { font-size: 12px; font-weight: 800; color: var(--c); font-variant-numeric: tabular-nums; }
  .connect-list .t { font-size: 15px; font-weight: 700; }

  /* PC 일정표 (열=일차, 행=시간) */
  .sched-grid { display: none; }
  @media (min-width: 1000px) {
    .sched-list { display: none; }
    .talks .tr { grid-template-columns: 76px 1fr; }
    .talks .tr-head { display: grid; border-top: 0; padding-top: 0; }
    .tr-cells { grid-template-columns: 1fr 1fr; gap: 12px; }
    .tc.full { grid-column: 1 / -1; }
    .tc.empty { display: block; visibility: hidden; }
    .card > .group-title { display: none; }
    .sched-grid { display: grid; column-gap: 12px; row-gap: 0; }
    .sg-head {
      grid-row: 1; padding: 10px 14px; margin-bottom: 8px; border-radius: 12px; font-size: 14px; font-weight: 800;
      background: color-mix(in srgb, var(--c) 14%, transparent); color: var(--c);
    }
    .sg-time { grid-column: 1; padding-top: 10px; font-size: 13px; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }
    .sg-line { grid-column: 1 / -1; border-top: 1px dashed var(--border); pointer-events: none; }
    .sg-cell {
      margin: 5px 0; padding: 10px 14px; border-radius: 12px; z-index: 1;
      background: var(--surface); border: 1px solid var(--border); box-shadow: inset 3px 0 0 var(--c);
      display: flex; flex-direction: column; justify-content: center;
    }
    .sg-when { font-size: 12px; color: var(--ink-faint); font-variant-numeric: tabular-nums; display: flex; gap: 8px; align-items: center; }
    .sg-live { color: var(--live); font-weight: 700; }
    .sg-title { font-size: 15px; font-weight: 800; margin-top: 2px; }
    .sg-cell.is-break { background: transparent; border-style: dashed; box-shadow: none; }
    .sg-cell.is-break .sg-title { color: var(--ink-dim); font-weight: 600; }
    .sg-cell.is-past { opacity: .5; }
    .sg-cell.is-now { border-color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); }
  }

  /* 전시 목록 */
  .ex-part { margin-bottom: 26px; }
  .ex-part-head { display: flex; align-items: center; gap: 10px; margin: 0 0 12px; }
  .ex-part-head img { width: 38px; height: 38px; object-fit: contain; }

const ITEMS = [];
Object.entries(EVENT.programs).forEach(([key, prog]) => prog.groups.forEach(g => {
  const d = dayOf(g.day);
  g.items.forEach(it => {

    it.slots = it.times.map(([a, b]) => ({ a, b, t0: at(d.date, a), t1: at(d.date, b) }));
    it.t0 = Math.min(...it.slots.map(x => x.t0));

function phase() {
  const t = now();
  for (let i = 0; i < EVENT.days.length; i++) {
    const d = EVENT.days[i];
    if (t < d.t0) return { kind: i === 0 ? "before" : "between", target: d };
    if (t < d.t1) return { kind: "live", day: d };

  return { kind: "after" };

    h("div", { class: "prog-head" }, h("h3", {}, pr.name), h("span", { class: "muted small" }, pr.dates)));
  pr.groups.forEach(g => {
    if (pr.groups.length > 1) card.append(h("div", { class: "group-title" }, g.title));
    const ol = h("ol", { class: "timeline" });
    g.items.forEach(it => {
      const live = liveSlot(it, t);
      const cls = "sess" + (live ? " is-now" : t >= it.t1 ? " is-past" : "") + (it.break ? " is-break" : "");
      const first = it.slots[0], last = it.slots[it.slots.length - 1];
      ol.append(h("li", { class: cls },
        h("div", { class: "when" }, first.a, h("small", {}, `~${last.b}`)),
        h("div", {},
          live ? h("span", { class: "small", style: "color:var(--live);font-weight:700" }, h("span", { class: "live-dot" }), "진행 중") : null,
          h("div", { class: "title" }, it.title),
          it.slots.length > 1 ? h("div", { class: "slots" }, it.slots.map(x =>
            h("span", { class: x === live ? "on" : t >= x.t1 ? "past" : "" }, `${x.a}–${x.b}`))) : null,
          it.desc ? h("div", { class: "desc" }, it.desc) : null)));
    });
    card.append(h("div", { class: pr.groups.length > 1 ? "sched-list" : "" }, ol));
  });
  if (pr.groups.length > 1) card.append(schedGrid(pr, t));
  v.append(card);
}

// 발표 세션표: 행 = 시작 시각, 열 = 존 (PC), 모바일은 시각별로 쌓아서
function talksCard(t, pr) {
  const T = EVENT.talks, d = dayOf(T.day), zones = Object.entries(T.zones);
  const starts = [...new Set(T.items.map(x => x.start))].sort();
  const card = h("div", { class: "card talks", style: `--c:${pr.color}` },
    h("div", { class: "prog-head" }, h("h3", {}, pr.name), h("span", { class: "muted small" }, pr.dates)),
    h("div", { class: "tr tr-head" }, h("div", {}),
      h("div", { class: "tr-cells" }, zones.map(([, z]) => h("div", { class: "tz", style: `--c:${z.color}` }, z.name)))));
  starts.forEach(st => {
    const row = T.items.filter(x => x.start === st);
    const cell = x => {
      const z = x.zone ? T.zones[x.zone] : null;
      const t0 = at(d.date, x.start), t1 = at(d.date, x.end);
      const live = t0 <= t && t < t1;
      const label = !x.no ? "" : (x.no === "Intro" || x.no === "Special" ? x.no : "No." + x.no) + " · ";
      return h("div", { class: "tc" + (z ? "" : " full") + (x.break ? " is-break" : "") + (live ? " is-now" : t >= t1 ? " is-past" : ""), style: `--c:${z ? z.color : "var(--accent)"}` },
        h("div", { class: "tc-meta" },
          z || x.no ? h("span", { class: "badge" }, z ? z.name : "공통") : null,
          h("span", { class: "faint small" }, `${label}${x.start}–${x.end}`),
          live ? h("span", { class: "small", style: "color:var(--live);font-weight:700" }, h("span", { class: "live-dot" }), "진행 중") : null),
        h("div", { class: "tc-title" }, x.title));
    };
    const cells = row.some(x => !x.zone) ? row.map(cell)
      : zones.map(([k]) => { const x = row.find(r => r.zone === k); return x ? cell(x) : h("div", { class: "tc empty" }); });
    const end = row.map(x => x.end).sort().pop();
    card.append(h("div", { class: "tr" },
      h("div", { class: "when" }, st, h("small", {}, `~${end}`)),
      h("div", { class: "tr-cells" }, cells)));
  });
  return card;
}

// PC용 일정표: 열 = 일차, 행 = 시간 (시간 경계를 모아 칸을 나누고 항목은 여러 칸에 걸침)
function schedGrid(pr, t) {
  const toMin = hm => { const [a, b] = hm.split(":").map(Number); return a * 60 + b; };
  const marks = [...new Set(pr.groups.flatMap(g => g.items.flatMap(it => it.times.flat())))]
    .sort((a, b) => toMin(a) - toMin(b));
  const row = hm => marks.indexOf(hm) + 2;   // 1행은 머리글
  const grid = h("div", { class: "sched-grid", style: `grid-template-columns: 76px repeat(${pr.groups.length}, 1fr); grid-template-rows: auto repeat(${marks.length - 1}, minmax(52px, auto));` });
  grid.append(h("div", { class: "sg-corner" }));
  pr.groups.forEach((g, i) => grid.append(h("div", { class: "sg-head", style: `grid-column:${i + 2}` }, g.title)));
  marks.slice(0, -1).forEach((m, i) => {
    grid.append(h("div", { class: "sg-time", style: `grid-row:${i + 2}` }, m));
    grid.append(h("div", { class: "sg-line", style: `grid-row:${i + 2}` }));
  });
  pr.groups.forEach((g, gi) => g.items.forEach(it => it.slots.forEach(x => {
    const live = x.t0 <= t && t < x.t1;
    grid.append(h("div", {
      class: "sg-cell" + (live ? " is-now" : t >= x.t1 ? " is-past" : "") + (it.break ? " is-break" : ""),
      style: `grid-column:${gi + 2}; grid-row:${row(x.a)} / ${row(x.b)}`,
    },
      h("div", { class: "sg-when" }, `${x.a} – ${x.b}`, live ? h("span", { class: "sg-live" }, h("span", { class: "live-dot" }), "진행 중") : null),
      h("div", { class: "sg-title" }, it.title)));
  })));
  return grid;
}

// 클립보드 복사 (구형 브라우저는 textarea 방식으로)
function copyText(text, btn) {
  const done = ok => {
    const old = btn.dataset.label || btn.textContent;
    btn.dataset.label = old;
    btn.textContent = ok ? "복사됨 ✓" : "복사 실패";
    btn.classList.toggle("done", ok);
    clearTimeout(btn._t);
    btn._t = setTimeout(() => { btn.textContent = old; btn.classList.remove("done"); }, 1600);
  };
  const fallback = () => {
    const ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("readonly", ""); ta.style.cssText = "position:fixed;top:-1000px;opacity:0";
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch (e) {}
    ta.remove(); done(ok);
  };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(() => done(true), fallback);
  else fallback();
}

function renderShuttle() {
  const v = $("view-shuttle");
  v.textContent = "";
  v.append(pageHead("오시는 길", ART.ring));
  v.append(h("div", { class: "card", style: "margin-bottom:16px" },
    h("div", { class: "section-label" }, "행사장"),
    h("div", { class: "venue-row" },
      h("span", { class: "venue-name" }, EVENT.venue),
      EVENT.venueAddress ? h("span", { class: "venue-addr" }, EVENT.venueAddress) : null,
      EVENT.venueAddress ? h("button", { class: "copy-btn", type: "button", onclick: e => copyText(EVENT.venueAddress, e.currentTarget) }, "주소 복사") : null),
    EVENT.mapUrl ? h("a", { class: "btn", href: EVENT.mapUrl, target: "_blank", rel: "noopener" }, "지도에서 보기") : null));
  const d = dayOf(EVENT.shuttleDay), t = now();
  const isToday = todayDay() && todayDay().id === d.id;
  v.append(h("div", { class: "section-label", style: "margin-top:8px" }, `셔틀 버스 · ${d.sub} 운행`));
  const grid = h("div", { class: "stack shuttle-grid", style: "display:grid" });
  EVENT.shuttles.forEach(r => {
    const abs = r.times.map(([x]) => at(d.date, x));
    const nextIdx = isToday ? abs.findIndex(x => x > t) : -1;
    const total = r.times.reduce((n, [, c]) => n + c, 0);
    grid.append(h("div", { class: "card route" },
      h("div", { class: "route-head" }, h("h3", {}, r.name), h("span", { class: "badge", style: "--c:var(--accent)" }, `총 ${total}대`)),
      isToday ? h("div", { class: "next-bus" },
        nextIdx >= 0 ? [h("span", {}, "다음 출발"), h("span", {}, h("b", {}, r.times[nextIdx][0]), h("span", { class: "muted small" }, ` · ${mins(abs[nextIdx] - t)} 후`))]
                     : [h("span", {}, "오늘 운행이 끝났어요")]) : null,
      h("div", { class: "times" }, r.times.map(([x, c], i) =>
        h("span", { class: isToday && abs[i] <= t ? "past" : i === nextIdx ? "next" : "" }, x, c > 1 ? h("small", {}, ` ${c}대`) : null)))));
  });
  v.append(grid);
}

// ---------- 라우팅 ----------
const renderers = { home: renderHome, program: renderProgram, floors: renderFloors, shuttle: renderShuttle, join: renderJoin };
function route() {
  const [tab, sub] = (location.hash || "#home").slice(1).split("/");
  state.tab = renderers[tab] ? tab : "home";
  if (state.tab === "program" && (sub === "schedule" || sub === "exhibit")) state.view = sub;
  if (state.tab === "program" && sub === "connect") { state.view = "exhibit"; state.part = "connect"; }
  document.querySelectorAll(".tab").forEach(a => { if (a.dataset.tab === state.tab) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  document.querySelectorAll(".view").forEach(s => s.classList.toggle("active", s.id === "view-" + state.tab));
  renderers[state.tab]();
}
window.addEventListener("hashchange", () => { route(); window.scrollTo(0, 0); });

// ---------- 시계 ----------
function tickCountdown() {
  if (!cdEls) return;
  let s = Math.max(0, Math.floor((cdEls.target - now()) / 1000));
  const d = Math.floor(s / 86400); s %= 86400;
  const hh = Math.floor(s / 3600); s %= 3600;
  const mm = Math.floor(s / 60); s %= 60;
  cdEls.d.textContent = d; cdEls.h.textContent = pad(hh); cdEls.m.textContent = pad(mm); cdEls.s.textContent = pad(s);
}
function tickPill() {
  const p = phase(), pill = $("status-pill");
  pill.textContent = "";
  if (p.kind === "before" || p.kind === "between") {
    let s = Math.floor((p.target.t0 - now()) / 1000);
    const d = Math.floor(s / 86400); s %= 86400;
    pill.append(h("strong", {}, d > 0 ? `D-${d}` : p.target.label), ` ${pad(Math.floor(s / 3600))}:${pad(Math.floor(s % 3600 / 60))}:${pad(s % 60)}`);
  } else if (p.kind === "live") {
    pill.append(h("span", { class: "live-dot" }), h("strong", {}, `${p.day.label} 진행 중`));
  } else {
    pill.textContent = "행사 종료";
  }
}

let lastPhase = phase().kind, lastMinute = Math.floor(now() / 60000);
setInterval(() => {
  tickCountdown();
  tickPill();
  // 상태가 바뀌거나 1분이 지나면 '지금/다음' 정보가 있는 화면을 다시 그림
  const k = phase().kind, m = Math.floor(now() / 60000);
  if (k !== lastPhase || m !== lastMinute) {
    lastPhase = k; lastMinute = m;
    if (state.tab !== "join") renderers[state.tab]();
  }
}, 1000);

// ---------- 시작 ----------
$("brand").append(h("img", { src: LOGO, alt: EVENT.title, width: "86", height: "22" }));
$("footer").textContent = EVENT.footer;
document.title = EVENT.title;
tickPill();
route();
</script>
