<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>AID-X 해커톤 라이브 리더보드</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="stage" id="stage">

  <!-- Top bar -->
  <header class="topbar">
    <div class="topbar-left">
      <span class="live-dot"></span>
      <span class="live-label">LIVE</span>
      <h1 class="event-name" id="eventName">해커톤 라이브 리더보드</h1>
    </div>
    <div class="topbar-right">
      <span class="event-note" id="eventNote"></span>
      <span class="clock" id="clock">--:--:--</span>
    </div>
  </header>

  <!-- Main viewport that swaps between podium / ranking screens -->
  <main class="viewport" id="viewport">

    <section class="screen podium-screen" id="screen-podium" data-screen="podium">
      <h2 class="screen-title">🏆 TOP 3</h2>
      <div class="podium" id="podiumWrap">
        <!-- podium cards injected by JS -->
      </div>
    </section>

    <!-- rank list screens are injected dynamically by JS as .screen.rank-screen -->

  </main>

  <!-- Footer / progress -->
  <footer class="footbar">
    <div class="dots" id="screenDots"></div>
    <div class="updated" id="updatedAt">마지막 갱신 --</div>
  </footer>

  <!-- Hidden host-control panel -->
  <button class="panel-tab" id="panelTab" aria-label="진행자 패널 열기">⚙</button>

  <div class="control-panel" id="controlPanel" hidden>
    <div class="panel-header">
      <span>진행자 패널</span>
      <button id="panelClose" class="panel-close">✕</button>
    </div>
    <div class="panel-row">
      <button id="btnPrev">◀ 이전 화면</button>
      <button id="btnNext">다음 화면 ▶</button>
    </div>
    <div class="panel-row">
      <button id="btnPodium">시상대로 이동</button>
      <button id="btnPause">일시정지</button>
    </div>
    <div class="panel-row">
      <label for="rotateRange">화면 전환 간격: <span id="rotateVal">8</span>초</label>
      <input type="range" id="rotateRange" min="4" max="30" step="1" value="8" />
    </div>
    <div class="panel-row">
      <button id="btnRefresh">지금 새로고침</button>
    </div>
    <div class="panel-status">
      <div>폴링 주기: 15초</div>
      <div id="fetchStatus">상태: 대기 중</div>
      <div id="teamCount">팀 수: -</div>
    </div>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
