<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>AID-X 해커톤 Low-Code 리더보드 LIVE</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<link rel="stylesheet" href="style.css?v=20261015d" />
<style>
  /* 20-second opening countdown, then the regular board takes over. */
  .intro {
    position: absolute; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: var(--bg); transition: opacity 0.8s ease, visibility 0.8s;
  }
  .intro.done { opacity: 0; visibility: hidden; }
  .intro .backdrop { z-index: 0; }
  .intro-inner { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .intro-brand { display: flex; align-items: center; gap: 2rem; font-size: 6rem; font-weight: 900; letter-spacing: -0.03em; color: var(--ink); }
  .intro-brand .track-pill { font-size: 3.6rem; padding: 0.8rem 2.6rem; }
  .intro-sub { margin: 2.4rem 0 0; font-size: 3.6rem; font-weight: 700; color: var(--ink-2); }
  .intro-ring { position: relative; width: 46rem; height: 46rem; margin-top: 4.8rem; }
  .intro-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .intro-ring .track { fill: none; stroke: #e8eaf8; stroke-width: 14; }
  .intro-ring .bar { fill: none; stroke: url(#introGrad); stroke-width: 14; stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
  .intro-num {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 22rem; font-weight: 900; letter-spacing: -0.05em; font-variant-numeric: tabular-nums;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .intro-num.tick { animation: introTick 1s ease-out; }
  @keyframes introTick { 0% { transform: scale(1.25); opacity: 0.4; } 30% { transform: scale(1); opacity: 1; } 100% { transform: scale(1); } }
</style>
</head>
<body>

<div class="stage" id="stage" data-mode="status">

  <!-- Soft white background with floating glass shapes -->
  <div class="backdrop" aria-hidden="true">
    <span class="blob blob-a"></span>
    <span class="blob blob-b"></span>
    <span class="blob blob-c"></span>
  </div>

  <header class="topbar">
    <div class="topbar-left">
      <h1 class="brand"><span class="brand-x">AID-X</span> 해커톤</h1>
      <span class="track-pill">Low-Code</span>
    </div>
    <div class="topbar-right">
      <span class="basis-chip" id="basisChip" hidden></span>
      <span class="mode-chip" id="modeChip"><span class="mode-dot"></span><span id="modeLabel">LIVE</span></span>
      <span class="clock" id="clock">--:--:--</span>
    </div>
  </header>

  <!-- Screens for the current mode are injected here by app.js -->
  <main class="viewport" id="viewport"></main>

  <footer class="footbar">
    <div class="dots" id="screenDots"></div>
    <div class="countdown">
      <span class="countdown-text" id="countdownText">다음 화면까지 --초</span>
      <span class="countdown-track"><span class="countdown-fill" id="countdownFill"></span></span>
    </div>
    <div class="updated"></div>
  </footer>

  <!-- Opening countdown (live.html only) -->
  <div class="intro" id="intro">
    <div class="backdrop" aria-hidden="true">
      <span class="blob blob-a"></span>
      <span class="blob blob-b"></span>
      <span class="blob blob-c"></span>
    </div>
    <div class="intro-inner">
      <div class="intro-brand"><span><span class="brand-x">AID-X</span> 해커톤</span><span class="track-pill">Low-Code</span></div>
      <p class="intro-sub">잠시 후 리더보드를 공개합니다</p>
      <div class="intro-ring">
        <svg viewBox="0 0 200 200" aria-hidden="true">
          <defs><linearGradient id="introGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f45ff"/><stop offset="1" stop-color="#a35cff"/></linearGradient></defs>
          <circle class="track" cx="100" cy="100" r="90"/>
          <circle class="bar" id="introBar" cx="100" cy="100" r="90" pathLength="1" stroke-dasharray="1" stroke-dashoffset="0"/>
        </svg>
        <div class="intro-num" id="introNum">20</div>
      </div>
    </div>
  </div>

  <!-- Hidden host-control panel (P key) -->

  <div class="control-panel" id="controlPanel" hidden>
    <div class="panel-header">
      <span>진행자 패널</span>
      <button id="panelClose" class="panel-close">✕</button>
    </div>
    <div class="panel-row">
      <label for="modeSelect">화면 모드</label>
      <select id="modeSelect">
        <option value="auto">자동 (시간에 따라)</option>
        <option value="countdown">시작 카운트다운</option>
        <option value="wait">채점 중 (접수 마감 ~ 공개)</option>
        <option value="reveal">점수 공개 (공개 후 5분)</option>
        <option value="status">현황 공개</option>
        <option value="final">최종 결과</option>
      </select>
    </div>
    <div class="panel-row">
      <button id="btnPrev">◀ 이전 화면</button>
      <button id="btnNext">다음 화면 ▶</button>
      <button id="btnPause">일시정지</button>
    </div>
    <div class="panel-row">
      <button id="btnRefresh">지금 새로고침</button>
    </div>
    <div class="panel-status">
      <div id="scheduleStatus">공개 일정: -</div>
      <div id="fetchStatus">상태: 대기 중</div>
    </div>
    <div class="panel-row panel-links">
      <a href="?demo" target="_blank" rel="noopener">점수 공개 미리보기 ↗</a>
    </div>
  </div>

</div>

<script>window.REPLAY_ROUNDS = true;</script>
<script src="shared.js?v=20261014"></script>
<script>
(() => {
  // Count down from 20, then load the board so it starts from its first screen.
  const SECONDS = 20;
  const num = document.getElementById('introNum');
  const bar = document.getElementById('introBar');
  const end = Date.now() + SECONDS * 1000;
  let shown = SECONDS;
  const timer = setInterval(() => {
    const left = Math.max(0, Math.ceil((end - Date.now()) / 1000));
    bar.style.strokeDashoffset = String(1 - (end - Date.now()) / (SECONDS * 1000));
    if (left !== shown) {
      shown = left;
      num.textContent = left;
      num.classList.remove('tick'); void num.offsetWidth; num.classList.add('tick');
    }
    if (left === 0) {
      clearInterval(timer);
      const app = document.createElement('script');
      app.src = 'app.js?v=20261015r';
      app.onload = () => setTimeout(() => document.getElementById('intro').classList.add('done'), 600);
      document.body.appendChild(app);
    }
  }, 100);
})();
</script>
</body>
</html>
