<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>캡슐 뽑기</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="gacha.css" />
</head>
<body>

<div class="stage" id="stage">
  <div class="bokeh" id="bokeh"></div>

  <header class="topbar">
    <div class="topbar-title">
      <h1>🎰 캡슐 뽑기</h1>
      <p>버튼을 누를 때마다 1~16 중 하나가 무작위로 나옵니다. 이미 나온 번호는 다시 나오지 않습니다.
        팀 이름은 표시되지 않으니, 각 팀이 순서대로 나와 직접 뽑게 하세요.</p>
    </div>
    <nav>
      <a href="index.html" target="_blank" rel="noopener">실시간 화면 ↗</a>
      <a href="draw.html" target="_blank" rel="noopener">우주선 추첨 ↗</a>
      <a href="status.html" target="_blank" rel="noopener">현황 화면 ↗</a>
    </nav>
  </header>

  <div class="main-row">
    <div class="machine-area">
      <div class="machine">
        <div class="dome-wrap">
          <div class="dome" id="dome"></div>
        </div>
        <div class="machine-body">
          <div class="coin-slot"></div>
          <button class="crank-btn" id="btnDraw">🎰 캡슐 뽑기</button>
        </div>
      </div>
      <div class="remaining-hint" id="remainingHint">남은 캡슐: 16개</div>
      <div class="tray" id="tray">
        <div class="tray-placeholder">캡슐을 뽑아보세요</div>
      </div>
    </div>

    <aside class="order-panel">
      <h2>뽑힌 순서</h2>
      <ol id="orderList"></ol>
    </aside>
  </div>

  <div class="overlay" id="finaleOverlay" hidden>
    <div class="overlay-card">
      <h2>🎉 뽑기 완료!</h2>
      <ol class="finale-list" id="finaleList"></ol>
      <div class="finale-actions">
        <button class="small-btn" id="btnCopy">순서 복사</button>
        <button class="small-btn" id="btnRestart">🔄 다시 뽑기</button>
      </div>
    </div>
  </div>
</div>

<script src="gacha.js"></script>
</body>
</html>
